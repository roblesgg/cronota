<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  /* 2.16: Notas. Un planner sencillo: tres carriles (Ahora, Siguiente, Más tarde) con tarjetas de
     cristal, secciones propias, recordatorios y una caja fuerte cifrada aparte. */
  html, body { width:100%;height:100%; }
  body { border-radius:var(--radius);overflow:hidden; }
  .app { width:100%;height:100%;padding:24px;display:flex;flex-direction:column;gap:12px;position:relative;min-height:0;-webkit-app-region:no-drag; }
  .app-title { font-size:16px;font-weight:700;-webkit-app-region:drag;display:flex;align-items:center;gap:8px;flex-shrink:0; }
  .cabecera { display:flex;align-items:center;gap:8px;flex-shrink:0; }
  body:not(.embedded) .cabecera { padding-right:34px; }   /* la X de cerrar la ventana */
  .cabecera .app-title { flex:1; }
  .btn-caja {
    display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--border);
    background:var(--bg2);color:var(--text2);font:inherit;font-size:12px;font-weight:650;cursor:pointer;-webkit-app-region:no-drag;
    transition:background .15s, color .15s, transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .btn-caja:hover { color:var(--text);background:var(--bg3);transform:translateY(-1px); }
  .btn-caja.activo { color:var(--accent);border-color:color-mix(in srgb, var(--accent) 40%, transparent); }

  /* Apuntar rápido */
  .apuntar { display:flex;gap:8px;align-items:center;flex-shrink:0; }
  .apuntar input { flex:1; }
  .carril-sel { display:flex;background:var(--bg2);border-radius:999px;padding:3px;gap:2px;flex-shrink:0; }
  .carril-sel button { border:none;background:transparent;color:var(--text2);font:inherit;font-size:11.5px;font-weight:650;padding:6px 10px;border-radius:999px;cursor:pointer;white-space:nowrap; }
  .carril-sel button.activo { background:color-mix(in srgb, var(--accent2) 26%, transparent);color:var(--text); }

  /* Filtros por sección */
  .filtros { display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex-shrink:0; }
  .chip-sec {
    display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--border);
    background:transparent;color:var(--text2);font:inherit;font-size:12px;font-weight:600;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .chip-sec i { width:8px;height:8px;border-radius:50%;background:var(--c, var(--text3)); }
  .chip-sec:hover { color:var(--text);background:var(--bg2); }
  .chip-sec.activo { color:var(--text);background:color-mix(in srgb, var(--c, var(--accent2)) 22%, transparent);border-color:color-mix(in srgb, var(--c, var(--accent2)) 45%, transparent); }
  .chip-sec.mas { border-style:dashed; }
  .filtros input.buscar { margin-left:auto;flex:0 1 150px;width:150px !important;min-width:90px;padding:6px 10px !important;font-size:12px !important; }

  /* Tablero */
  .tablero { flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:2px 6px 8px 2px; container-type:inline-size; }
  .tablero::-webkit-scrollbar { width:8px; }
  .tablero::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--text) 22%, transparent);border-radius:4px; }
  .carriles { display:flex;flex-direction:column;gap:14px; }
  @container (min-width: 720px) { .carriles { display:grid;grid-template-columns:repeat(3, minmax(0,1fr));align-items:start; } }
  .carril { display:flex;flex-direction:column;gap:8px;border-radius:18px;padding:10px;background:color-mix(in srgb, var(--bg2) 60%, transparent);border:1px solid var(--border);transition:background .2s, border-color .2s; min-height:64px; }
  .carril.encima { background:color-mix(in srgb, var(--accent2) 14%, transparent);border-color:color-mix(in srgb, var(--accent) 45%, transparent); }
  .carril-cab { display:flex;align-items:center;gap:8px;padding:2px 4px; }
  .carril-cab b { font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--text2); }
  .carril-cab .n { font-size:11px;color:var(--text3);margin-left:auto; }
  .carril-cab .punto { width:8px;height:8px;border-radius:50%; }
  .carril[data-carril="ahora"] .punto { background:#f87171;box-shadow:0 0 10px #f8717188; }
  .carril[data-carril="siguiente"] .punto { background:#fbbf24; }
  .carril[data-carril="luego"] .punto { background:#60a5fa; }
  .carril-vacio { font-size:12px;color:var(--text3);text-align:center;padding:10px 4px; }

  /* Tarjeta de cristal */
  .nota {
    position:relative;border-radius:16px;padding:11px 12px 10px;cursor:grab;color:var(--text);
    background:
      radial-gradient(120% 80% at 20% 0%, rgba(255,255,255,.16), rgba(255,255,255,0) 60%),
      linear-gradient(160deg, color-mix(in srgb, var(--c, var(--accent2)) 30%, transparent), color-mix(in srgb, var(--c, var(--accent2)) 12%, transparent));
    -webkit-backdrop-filter:blur(10px) saturate(1.6); backdrop-filter:blur(10px) saturate(1.6);
    border:1px solid color-mix(in srgb, var(--c, #fff) 35%, rgba(255,255,255,.18));
    box-shadow:inset 0 1px 1px rgba(255,255,255,.35), 0 8px 18px -10px rgba(0,0,0,.55);
    transition:transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .25s, opacity .25s;
    animation:notaCae .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  .nota:not([style*="--c"]) { --c: #8b93a7; }
  .nota:hover { transform:translateY(-2px); box-shadow:inset 0 1px 1px rgba(255,255,255,.4), 0 14px 26px -12px rgba(0,0,0,.6); }
  .nota.arrastrando { opacity:.35; }
  .nota.se-va { animation:notaSeVa .28s cubic-bezier(.4,0,1,1) both; }
  .nota.hecha { opacity:.6; }
  .nota.hecha .nota-texto { text-decoration:line-through; }
  @keyframes notaCae { from { opacity:0; transform:translateY(-10px) scale(.94); filter:blur(4px); } to { opacity:1; transform:none; filter:none; } }
  @keyframes notaSeVa { to { opacity:0; transform:scale(.9); filter:blur(5px); } }
  .nota.marca-antes::before { content:'';position:absolute;left:8px;right:8px;top:-6px;height:3px;border-radius:2px;background:var(--accent); }
  .nota-texto { font-size:13.5px;line-height:1.4;white-space:pre-wrap;word-break:break-word; }
  .nota-texto .casilla { display:flex;gap:7px;align-items:flex-start;cursor:pointer; }
  .nota-texto .casilla input { margin-top:3px;accent-color:var(--accent);cursor:pointer; }
  .nota-texto .casilla.marcada span { text-decoration:line-through;opacity:.6; }
  .nota-meta { display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center; }
  .etq { font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.18);color:var(--text);display:inline-flex;align-items:center;gap:5px; }
  .etq.recordatorio.hoy { background:color-mix(in srgb, #fbbf24 30%, transparent); }
  .etq.recordatorio.vencido { background:color-mix(in srgb, #f87171 38%, transparent); }
  .nota-acc { position:absolute;top:6px;right:6px;display:flex;gap:2px;opacity:0;transform:translateY(-2px);transition:opacity .15s, transform .25s; }
  .nota:hover .nota-acc, .nota:focus-within .nota-acc { opacity:1;transform:none; }
  .nota-acc button { width:24px;height:24px;border:none;border-radius:8px;background:rgba(0,0,0,.28);color:#fff;display:grid;place-items:center;cursor:pointer; }
  .nota-acc button:hover { background:rgba(0,0,0,.5); }
  .nota-acc button.peligro:hover { background:var(--danger, #e5484d); }

  .hechas-cab { display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);font-weight:650;cursor:pointer;padding:4px; }
  .hechas-cab svg { transition:transform .2s; }
  .hechas-cab.abierta svg { transform:rotate(90deg); }
  .hechas-cab button { margin-left:auto; }
  .hechas-lista { display:flex;flex-direction:column;gap:6px; }

  /* Popups */
  .pop-nota { width:380px; }
  .pop-nota textarea { min-height:110px;resize:vertical; }
  .fila { display:flex;gap:8px;align-items:center;flex-wrap:wrap; }
  .fila > label.et { font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);min-width:74px; }
  .colores { display:flex;gap:5px;flex-wrap:wrap; }
  .colores button { width:20px;height:20px;border-radius:50%;border:none;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15); }
  .colores button.sel { outline:2px solid var(--text);outline-offset:1px; }
  .colores button.ninguno { background:transparent;border:1.5px dashed var(--text3); }
  .rapidos { display:flex;gap:5px;flex-wrap:wrap; }
  .rapidos button { border:1px solid var(--border);background:transparent;color:var(--text2);font:inherit;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;cursor:pointer; }
  .rapidos button:hover { color:var(--text);background:var(--bg2); }

  /* Caja fuerte */
  .caja { flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;animation:notaCae .45s cubic-bezier(.34,1.56,.64,1) both; }
  .caja[hidden] { display:none; }
  .caja-cerrada { flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:10px; }
  .candado {
    width:84px;height:84px;border-radius:28px;display:grid;place-items:center;color:var(--accent);
    background:radial-gradient(120% 80% at 30% 0%, rgba(255,255,255,.22), rgba(255,255,255,0) 60%), color-mix(in srgb, var(--accent2) 18%, transparent);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.18); box-shadow:inset 0 1px 1px rgba(255,255,255,.35), 0 14px 30px -14px rgba(0,0,0,.6);
  }
  .candado.temblor { animation:temblor .4s; }
  @keyframes temblor { 20%,60% { transform:translateX(-6px); } 40%,80% { transform:translateX(6px); } }
  .caja-cerrada h3 { margin:0;font-size:17px; }
  .caja-cerrada p { margin:0;font-size:12.5px;color:var(--text2);max-width:300px;line-height:1.45; }
  .caja-cerrada input { width:230px !important;padding:11px 14px !important;text-align:center;font-size:16px !important;letter-spacing:.2em; }
  .caja-cerrada input[type="password"].clave { letter-spacing:.05em; }
  .caja-cerrada input::placeholder { letter-spacing:normal;font-size:13px; }
  .caja-error { color:var(--danger, #e5484d);font-size:12.5px;min-height:16px; }
  .enlace { background:none;border:none;color:var(--text3);font:inherit;font-size:11.5px;cursor:pointer;text-decoration:underline; }
  .caja-abierta { flex:1;min-height:0;display:flex;flex-direction:column;gap:10px; }
  .caja-lista { flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:6px; }
  .nota.segura { --c:#8b5cf6; cursor:pointer; }
  .nota.segura .nota-titulo { font-weight:700;font-size:13.5px;margin-bottom:3px; }
  .caja-aviso { font-size:11.5px;color:var(--text3);text-align:center; }
</style>
<link rel="stylesheet" href="mac.css">
</head>
<body>
<div class="app animate-in">
  <div class="win-drag" title="Arrastra para mover la ventana"></div>
  <div class="win-controls">
    <button class="win-btn close" onclick="ipcRenderer.send('action', { type: 'close-notas' })" title="Cerrar">
      <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="cabecera">
    <div class="app-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5z"/><path d="M15 3v5a1 1 0 0 0 1 1h5"/><path d="M7 13h7M7 17h4"/></svg>
      <span id="titulo">Notas</span>
    </div>
    <button class="btn-caja" id="btnCaja" onclick="alternarCaja()" title="Notas protegidas con PIN o contraseña">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span>Caja fuerte</span>
    </button>
  </div>

  <!-- Tablero -->
  <div id="vistaTablero" style="display:flex;flex-direction:column;gap:12px;flex:1;min-height:0">
    <div class="apuntar">
      <input type="text" id="apuntarInput" maxlength="4000" placeholder="Apunta algo… (Enter)" autocomplete="off">
      <div class="carril-sel" id="apuntarCarril">
        <button type="button" data-c="ahora" class="activo">Ahora</button>
        <button type="button" data-c="siguiente">Siguiente</button>
        <button type="button" data-c="luego">Más tarde</button>
      </div>
    </div>
    <div class="filtros" id="filtros"></div>
    <div class="tablero" id="tablero"></div>
  </div>

  <!-- Caja fuerte -->
  <div class="caja" id="vistaCaja" hidden></div>
</div>

<!-- Editar nota -->
<div class="popup-backdrop" id="popNotaFondo" style="display:none" onclick="cerrarPopNota()"></div>
<div class="entry-popup pop-nota" id="popNota" style="display:none">
  <div class="entry-popup-title" id="popNotaTitulo">Nota</div>
  <textarea id="pnTexto" maxlength="4000" placeholder="Escribe la nota… (una línea que empiece por [ ] es una casilla)"></textarea>
  <div class="fila"><label class="et">Carril</label>
    <div class="carril-sel" id="pnCarril">
      <button type="button" data-c="ahora">Ahora</button>
      <button type="button" data-c="siguiente">Siguiente</button>
      <button type="button" data-c="luego">Más tarde</button>
    </div>
  </div>
  <div class="fila"><label class="et" for="pnSeccion">Sección</label><select id="pnSeccion" style="flex:1"></select></div>
  <div class="fila"><label class="et">Color</label><div class="colores" id="pnColores"></div></div>
  <div class="fila"><label class="et" for="pnRecordatorio">Recordar</label><input type="datetime-local" id="pnRecordatorio" style="flex:1"></div>
  <div class="rapidos" id="pnRapidos">
    <button type="button" data-r="1h">En 1 hora</button>
    <button type="button" data-r="tarde">Esta tarde 17:00</button>
    <button type="button" data-r="manana">Mañana 9:00</button>
    <button type="button" data-r="quitar">Sin recordatorio</button>
  </div>
  <div class="entry-popup-actions">
    <button class="btn-danger" id="pnBorrar" onclick="borrarDesdePop()">Borrar</button>
    <div style="flex:1"></div>
    <button class="btn-ghost" onclick="cerrarPopNota()">Cancelar</button>
    <button class="btn-primary" onclick="guardarPopNota()">Guardar</button>
  </div>
</div>

<!-- Sección de notas -->
<div class="popup-backdrop" id="popSecFondo" style="display:none" onclick="cerrarPopSec()"></div>
<div class="entry-popup" id="popSec" style="display:none;width:320px">
  <div class="entry-popup-title" id="popSecTitulo">Nueva sección</div>
  <input type="text" id="psNombre" maxlength="40" placeholder="Nombre (p. ej. un cliente o un tema)">
  <div class="colores" id="psColores"></div>
  <div class="entry-popup-actions">
    <button class="btn-danger" id="psBorrar" onclick="borrarSeccion()">Borrar</button>
    <div style="flex:1"></div>
    <button class="btn-ghost" onclick="cerrarPopSec()">Cancelar</button>
    <button class="btn-primary" onclick="guardarSeccion()">Guardar</button>
  </div>
</div>

<!-- Confirmar -->
<div class="popup-backdrop" id="popConfFondo" style="display:none;z-index:60" onclick="cerrarConf()"></div>
<div class="entry-popup" id="popConf" style="display:none;width:320px;z-index:61">
  <div class="entry-popup-title" id="confTitulo"></div>
  <div style="font-size:13px;color:var(--text2);line-height:1.45" id="confTexto"></div>
  <div class="entry-popup-actions">
    <div style="flex:1"></div>
    <button class="btn-ghost" onclick="cerrarConf()">Cancelar</button>
    <button class="btn-danger" id="confOk">Aceptar</button>
  </div>
</div>

<script src="shared.js"></script>
<script src="movimiento.js"></script>
<script src="glass.js"></script>
<script>
const { ipcRenderer } = require('electron');
let currentState = null;
let filtroSeccion = '';      // '' = todas
let busqueda = '';
let carrilApuntar = 'ahora';
let hechasAbiertas = false;
const CARRILES = [['ahora', 'Ahora'], ['siguiente', 'Siguiente'], ['luego', 'Más tarde']];
const COLORES_NOTA = ['#f87171', '#fb923c', '#fbbf24', '#a3e635', '#34d399', '#2dd4bf', '#38bdf8', '#60a5fa', '#818cf8', '#a78bfa', '#e879f9', '#f472b6'];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enviar = (type, payload) => ipcRenderer.send('action', { type, payload });

ipcRenderer.on('state', (_, s) => {
  currentState = s;
  pintar();
  pintarBotonCaja();
});
ipcRenderer.send('action', { type: 'get-state' });

// ── Apuntar rápido ────────────────────────────────────────────────────────────
document.querySelectorAll('#apuntarCarril button').forEach(b => b.onclick = () => {
  carrilApuntar = b.dataset.c;
  document.querySelectorAll('#apuntarCarril button').forEach(x => x.classList.toggle('activo', x === b));
});
document.getElementById('apuntarInput').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const t = e.target.value.trim();
  if (!t) return;
  enviar('nota-crear', { texto: t, carril: carrilApuntar, seccion: filtroSeccion || null });
  e.target.value = '';
});

// ── Pintar ────────────────────────────────────────────────────────────────────
function seccionDe(id) { return ((currentState && currentState.seccionesNotas) || []).find(s => s.id === id) || null; }
function pintar() {
  if (!currentState) return;
  pintarFiltros();
  const tablero = document.getElementById('tablero');
  const scroll = tablero.scrollTop;
  tablero.innerHTML = '';
  const todas = (currentState.notas || []).filter(n => (!filtroSeccion || n.seccion === filtroSeccion)
    && (!busqueda || n.texto.toLowerCase().includes(busqueda)));
  const wrap = document.createElement('div'); wrap.className = 'carriles';
  CARRILES.forEach(([c, nombre]) => {
    const lista = todas.filter(n => !n.hecha && n.carril === c);
    const col = document.createElement('div');
    col.className = 'carril'; col.dataset.carril = c;
    col.innerHTML = `<div class="carril-cab"><span class="punto"></span><b>${nombre}</b><span class="n">${lista.length || ''}</span></div>`;
    lista.forEach(n => col.appendChild(tarjeta(n)));
    if (!lista.length) { const v = document.createElement('div'); v.className = 'carril-vacio'; v.textContent = c === 'ahora' ? 'Nada urgente. Apunta arriba lo que toque.' : 'Arrastra aquí'; col.appendChild(v); }
    prepararSoltar(col, c);
    wrap.appendChild(col);
  });
  tablero.appendChild(wrap);
  const hechas = todas.filter(n => n.hecha);
  if (hechas.length) {
    const cab = document.createElement('div');
    cab.className = 'hechas-cab' + (hechasAbiertas ? ' abierta' : '');
    cab.innerHTML = `<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 1l4 4-4 4"/></svg> Hechas (${hechas.length}) <button class="btn-ghost" style="padding:4px 10px;font-size:11.5px">Vaciar</button>`;
    cab.onclick = (e) => { if (e.target.closest('button')) return; hechasAbiertas = !hechasAbiertas; pintar(); };
    cab.querySelector('button').onclick = () => confirmar('Vaciar hechas', `Se borran las ${hechas.length} notas hechas. Ctrl+Z lo deshace.`, 'Vaciar', () => enviar('notas-vaciar-hechas'));
    tablero.appendChild(cab);
    if (hechasAbiertas) {
      const l = document.createElement('div'); l.className = 'hechas-lista';
      hechas.sort((a, b) => (b.hechaEn || 0) - (a.hechaEn || 0)).forEach(n => l.appendChild(tarjeta(n)));
      tablero.appendChild(l);
    }
  }
  tablero.scrollTop = scroll;
}

function pintarFiltros() {
  const f = document.getElementById('filtros');
  const buscarVal = busqueda;
  f.innerHTML = '';
  const chip = (id, nombre, color) => {
    const b = document.createElement('button');
    b.className = 'chip-sec' + (filtroSeccion === id ? ' activo' : '');
    if (color) b.style.setProperty('--c', color);
    b.innerHTML = (color ? '<i></i>' : '') + esc(nombre);
    b.onclick = () => { filtroSeccion = id; pintar(); };
    if (id) { b.title = 'Doble clic para cambiarla'; b.ondblclick = () => abrirPopSec(id); }
    f.appendChild(b);
  };
  chip('', 'Todas');
  ((currentState && currentState.seccionesNotas) || []).forEach(s => chip(s.id, s.name, s.color));
  const mas = document.createElement('button'); mas.className = 'chip-sec mas'; mas.textContent = '+ Sección'; mas.onclick = () => abrirPopSec(null);
  f.appendChild(mas);
  const q = document.createElement('input'); q.type = 'text'; q.className = 'buscar'; q.placeholder = 'Buscar…'; q.value = buscarVal;
  q.oninput = () => { busqueda = q.value.trim().toLowerCase(); pintar(); const nq = document.querySelector('.buscar'); nq.focus(); nq.setSelectionRange(nq.value.length, nq.value.length); };
  f.appendChild(q);
}

function textoRecordatorio(ms) {
  const d = new Date(ms), hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const dia = new Date(d); dia.setHours(0, 0, 0, 0);
  const diff = Math.round((dia - hoy) / 86400000);
  const hora = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  if (diff === 0) return 'Hoy ' + hora;
  if (diff === 1) return 'Mañana ' + hora;
  if (diff === -1) return 'Ayer ' + hora;
  return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) + ' ' + hora;
}

const ICO = {
  hecha: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
  deshecha: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
  editar: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  borrar: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>',
  reloj: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
};

function tarjeta(n) {
  const el = document.createElement('div');
  el.className = 'nota' + (n.hecha ? ' hecha' : '');
  el.dataset.id = n.id;
  const sec = seccionDe(n.seccion);
  const color = n.color || (sec && sec.color);
  if (color) el.style.setProperty('--c', color);
  el.draggable = !n.hecha;
  // Texto, con las líneas «[ ]» / «[x]» como casillas.
  const txt = document.createElement('div'); txt.className = 'nota-texto';
  n.texto.split('\n').forEach((linea, i, todas) => {
    const m = linea.match(/^\s*(?:-\s*)?\[( |x|X)\]\s?(.*)$/);
    if (m) {
      const fila = document.createElement('label');
      fila.className = 'casilla' + (m[1] !== ' ' ? ' marcada' : '');
      fila.innerHTML = `<input type="checkbox" ${m[1] !== ' ' ? 'checked' : ''}><span>${esc(m[2])}</span>`;
      fila.querySelector('input').onchange = (e) => {
        const lineas = n.texto.split('\n');
        lineas[i] = linea.replace(/\[( |x|X)\]/, e.target.checked ? '[x]' : '[ ]');
        enviar('nota-editar', { id: n.id, texto: lineas.join('\n') });
      };
      fila.onclick = (e) => e.stopPropagation();
      txt.appendChild(fila);
    } else {
      txt.appendChild(document.createTextNode(linea + (i < todas.length - 1 ? '\n' : '')));
    }
  });
  el.appendChild(txt);
  const meta = document.createElement('div'); meta.className = 'nota-meta';
  if (sec && !filtroSeccion) meta.insertAdjacentHTML('beforeend', `<span class="etq">${esc(sec.name)}</span>`);
  if (n.recordatorio) {
    const ahora = Date.now(), d = new Date(n.recordatorio), hoy = new Date();
    const clase = !n.hecha && n.recordatorio <= ahora ? ' vencido' : (d.toDateString() === hoy.toDateString() ? ' hoy' : '');
    meta.insertAdjacentHTML('beforeend', `<span class="etq recordatorio${clase}">${ICO.reloj}${textoRecordatorio(n.recordatorio)}</span>`);
  }
  if (meta.children.length) el.appendChild(meta);
  const acc = document.createElement('div'); acc.className = 'nota-acc';
  acc.innerHTML = `<button title="${n.hecha ? 'Volver a pendiente' : 'Hecha'}" data-a="hecha">${n.hecha ? ICO.deshecha : ICO.hecha}</button><button title="Editar" data-a="editar">${ICO.editar}</button><button class="peligro" title="Borrar (Ctrl+Z lo deshace)" data-a="borrar">${ICO.borrar}</button>`;
  acc.onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    e.stopPropagation();
    if (b.dataset.a === 'editar') abrirPopNota(n.id);
    else if (b.dataset.a === 'hecha') irse(el, () => enviar('nota-editar', { id: n.id, hecha: !n.hecha }));
    else if (b.dataset.a === 'borrar') irse(el, () => enviar('nota-borrar', { id: n.id }));
  };
  el.appendChild(acc);
  el.ondblclick = () => abrirPopNota(n.id);
  // Arrastrar entre carriles y para ordenar.
  el.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/nota', n.id); e.dataTransfer.effectAllowed = 'move'; el.classList.add('arrastrando'); });
  el.addEventListener('dragend', () => { el.classList.remove('arrastrando'); document.querySelectorAll('.marca-antes').forEach(x => x.classList.remove('marca-antes')); });
  return el;
}
function irse(el, luego) { el.classList.add('se-va'); setTimeout(luego, 240); }

function prepararSoltar(col, carril) {
  const destino = (e) => {
    const notas = [...col.querySelectorAll('.nota:not(.arrastrando)')];
    return notas.find(x => { const r = x.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; }) || null;
  };
  col.addEventListener('dragover', (e) => {
    if (![...e.dataTransfer.types].includes('text/nota')) return;
    e.preventDefault();
    col.classList.add('encima');
    document.querySelectorAll('.marca-antes').forEach(x => x.classList.remove('marca-antes'));
    const d = destino(e); if (d) d.classList.add('marca-antes');
  });
  col.addEventListener('dragleave', (e) => { if (!col.contains(e.relatedTarget)) col.classList.remove('encima'); });
  col.addEventListener('drop', (e) => {
    const id = e.dataTransfer.getData('text/nota');
    col.classList.remove('encima');
    if (!id) return;
    e.preventDefault();
    const d = destino(e);
    enviar('nota-mover', { id, carril, antesDe: d ? d.dataset.id : null });
  });
}

// ── Editar nota ───────────────────────────────────────────────────────────────
let popId = null, popColor = null, popCarril = 'ahora';
function aLocal(ms) { const d = new Date(ms - new Date(ms).getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); }
function abrirPopNota(id) {
  const n = (currentState.notas || []).find(x => x.id === id);
  if (!n) return;
  popId = id; popColor = n.color || null; popCarril = n.carril;
  document.getElementById('pnTexto').value = n.texto;
  const sel = document.getElementById('pnSeccion');
  sel.innerHTML = '<option value="">Sin sección</option>' + (currentState.seccionesNotas || []).map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
  sel.value = n.seccion || '';
  document.getElementById('pnRecordatorio').value = n.recordatorio ? aLocal(n.recordatorio) : '';
  pintarCarrilPop(); pintarColoresPop();
  document.getElementById('popNotaFondo').style.display = 'block';
  document.getElementById('popNota').style.display = 'flex';
  setTimeout(() => document.getElementById('pnTexto').focus(), 0);
}
function pintarCarrilPop() { document.querySelectorAll('#pnCarril button').forEach(b => b.classList.toggle('activo', b.dataset.c === popCarril)); }
document.querySelectorAll('#pnCarril button').forEach(b => b.onclick = () => { popCarril = b.dataset.c; pintarCarrilPop(); });
function pintarColoresPop() {
  const c = document.getElementById('pnColores'); c.innerHTML = '';
  const nada = document.createElement('button'); nada.className = 'ninguno' + (!popColor ? ' sel' : ''); nada.title = 'Sin color (el de su sección)'; nada.onclick = () => { popColor = null; pintarColoresPop(); }; c.appendChild(nada);
  COLORES_NOTA.forEach(col => { const b = document.createElement('button'); b.style.background = col; if (popColor === col) b.className = 'sel'; b.onclick = () => { popColor = col; pintarColoresPop(); }; c.appendChild(b); });
}
document.querySelectorAll('#pnRapidos button').forEach(b => b.onclick = () => {
  const i = document.getElementById('pnRecordatorio');
  const d = new Date();
  if (b.dataset.r === 'quitar') { i.value = ''; return; }
  if (b.dataset.r === '1h') d.setTime(Date.now() + 3600000);
  if (b.dataset.r === 'tarde') { d.setHours(17, 0, 0, 0); if (d < new Date()) d.setDate(d.getDate() + 1); }
  if (b.dataset.r === 'manana') { d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); }
  i.value = aLocal(d.getTime());
});
function cerrarPopNota() { popId = null; document.getElementById('popNotaFondo').style.display = 'none'; document.getElementById('popNota').style.display = 'none'; }
function guardarPopNota() {
  const texto = document.getElementById('pnTexto').value.trim();
  if (!texto) { borrarDesdePop(); return; }
  const r = document.getElementById('pnRecordatorio').value;
  enviar('nota-editar', { id: popId, texto, carril: popCarril, seccion: document.getElementById('pnSeccion').value || null, color: popColor, recordatorio: r ? new Date(r).getTime() : null });
  cerrarPopNota();
}
function borrarDesdePop() { const id = popId; cerrarPopNota(); const el = document.querySelector(`.nota[data-id="${id}"]`); if (el) irse(el, () => enviar('nota-borrar', { id })); else enviar('nota-borrar', { id }); }

// ── Secciones ─────────────────────────────────────────────────────────────────
let secId = null, secColor = COLORES_NOTA[6];
function abrirPopSec(id) {
  const s = id ? seccionDe(id) : null;
  secId = s ? id : null; secColor = s ? s.color : COLORES_NOTA[((currentState.seccionesNotas || []).length * 3) % COLORES_NOTA.length];
  document.getElementById('popSecTitulo').textContent = s ? 'Sección' : 'Nueva sección';
  document.getElementById('psNombre').value = s ? s.name : '';
  document.getElementById('psBorrar').style.display = s ? '' : 'none';
  pintarColoresSec();
  document.getElementById('popSecFondo').style.display = 'block';
  document.getElementById('popSec').style.display = 'flex';
  setTimeout(() => document.getElementById('psNombre').focus(), 0);
}
function pintarColoresSec() {
  const c = document.getElementById('psColores'); c.innerHTML = '';
  COLORES_NOTA.forEach(col => { const b = document.createElement('button'); b.style.background = col; if (secColor === col) b.className = 'sel'; b.onclick = () => { secColor = col; pintarColoresSec(); }; c.appendChild(b); });
}
function cerrarPopSec() { document.getElementById('popSecFondo').style.display = 'none'; document.getElementById('popSec').style.display = 'none'; }
function guardarSeccion() {
  const name = document.getElementById('psNombre').value.trim();
  if (!name) return;
  if (secId) enviar('nota-seccion-editar', { id: secId, name, color: secColor });
  else enviar('nota-seccion-crear', { name, color: secColor });
  cerrarPopSec();
}
document.getElementById('psNombre').addEventListener('keydown', (e) => { if (e.key === 'Enter') guardarSeccion(); });
function borrarSeccion() {
  const s = seccionDe(secId); if (!s) return;
  confirmar('Borrar sección', `La sección «${s.name}» se borra; sus notas se quedan, sin sección. Ctrl+Z lo deshace.`, 'Borrar', () => {
    enviar('nota-seccion-borrar', { id: secId }); if (filtroSeccion === secId) filtroSeccion = ''; cerrarPopSec();
  });
}

// ── Confirmar ─────────────────────────────────────────────────────────────────
function confirmar(titulo, texto, ok, fn) {
  document.getElementById('confTitulo').textContent = titulo;
  document.getElementById('confTexto').textContent = texto;
  const b = document.getElementById('confOk'); b.textContent = ok;
  b.onclick = () => { cerrarConf(); fn(); };
  document.getElementById('popConfFondo').style.display = 'block';
  document.getElementById('popConf').style.display = 'flex';
}
function cerrarConf() { document.getElementById('popConfFondo').style.display = 'none'; document.getElementById('popConf').style.display = 'none'; }

// Ctrl+Z / Ctrl+Y fuera de los campos de texto: deshacer y rehacer, como en el calendario.
document.addEventListener('keydown', (e) => {
  const enCampo = e.target.closest && e.target.closest('input, textarea, select');
  if (e.key === 'Escape') { cerrarPopNota(); cerrarPopSec(); cerrarConf(); return; }
  if (enCampo || !(e.ctrlKey || e.metaKey)) return;
  if (e.key.toLowerCase() === 'z') { e.preventDefault(); enviar(e.shiftKey ? 'redo' : 'undo'); }
  if (e.key.toLowerCase() === 'y') { e.preventDefault(); enviar('redo'); }
});

// ── Caja fuerte ───────────────────────────────────────────────────────────────
// Lo de dentro solo pasa por aquí mientras está abierta: al cerrarse (a mano, a los 5 minutos,
// al bloquear Windows) se borra de la página.
let enCaja = false, cajaNotas = null, cajaTipoNuevo = 'pin';
const caja = (accion, extra) => ipcRenderer.invoke('caja', { accion, ...(extra || {}) });
function pintarBotonCaja() {
  const b = document.getElementById('btnCaja');
  b.classList.toggle('activo', enCaja);
  b.querySelector('span').textContent = enCaja ? 'Volver a notas' : 'Caja fuerte';
}
async function alternarCaja() {
  enCaja = !enCaja;
  document.getElementById('vistaTablero').style.display = enCaja ? 'none' : 'flex';
  document.getElementById('vistaCaja').hidden = !enCaja;
  document.getElementById('titulo').textContent = enCaja ? 'Caja fuerte' : 'Notas';
  pintarBotonCaja();
  if (enCaja) pintarCaja(await caja('estado'));
}
ipcRenderer.on('caja-cerrada', () => { cajaNotas = null; if (enCaja) caja('estado').then(pintarCaja); });

const CANDADO = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><circle cx="12" cy="16" r="1.3" fill="currentColor"/></svg>';
function pintarCaja(est) {
  const v = document.getElementById('vistaCaja');
  if (!est || !est.existe) {
    v.innerHTML = `<div class="caja-cerrada">
      <div class="candado">${CANDADO}</div>
      <h3>Crea tu caja fuerte</h3>
      <p>Notas que nadie ve sin tu PIN o tu contraseña. Se guardan cifradas: si lo olvidas, no hay forma de recuperarlas.</p>
      <div class="carril-sel" id="cjTipo"><button type="button" data-t="pin">PIN</button><button type="button" data-t="clave">Contraseña</button></div>
      <input type="password" id="cj1" autocomplete="new-password">
      <input type="password" id="cj2" autocomplete="new-password">
      <div class="caja-error" id="cjError"></div>
      <button class="btn-primary" id="cjCrear">Crear caja fuerte</button>
    </div>`;
    const ponerTipo = (t) => {
      cajaTipoNuevo = t;
      v.querySelectorAll('#cjTipo button').forEach(b => b.classList.toggle('activo', b.dataset.t === t));
      ['cj1', 'cj2'].forEach((id, i) => { const el = document.getElementById(id); el.inputMode = t === 'pin' ? 'numeric' : 'text'; el.maxLength = t === 'pin' ? 8 : 128; el.classList.toggle('clave', t === 'clave'); el.placeholder = (t === 'pin' ? 'PIN de 4 a 8 números' : 'Contraseña (mín. 6)') + (i ? ' · otra vez' : ''); });
    };
    v.querySelectorAll('#cjTipo button').forEach(b => b.onclick = () => ponerTipo(b.dataset.t));
    ponerTipo(cajaTipoNuevo);
    const crear = async () => {
      const a = document.getElementById('cj1').value, b = document.getElementById('cj2').value;
      const err = document.getElementById('cjError');
      if (a !== b) { err.textContent = 'No coinciden'; return; }
      const r = await caja('crear', { secreto: a, tipo: cajaTipoNuevo });
      if (r.error) { err.textContent = r.error; return; }
      cajaNotas = r.notas; pintarCaja(r);
    };
    document.getElementById('cjCrear').onclick = crear;
    document.getElementById('cj2').addEventListener('keydown', (e) => { if (e.key === 'Enter') crear(); });
    setTimeout(() => document.getElementById('cj1').focus(), 0);
    return;
  }
  if (!est.abierta || !cajaNotas) {
    cajaNotas = null;
    v.innerHTML = `<div class="caja-cerrada">
      <div class="candado" id="cjCandado">${CANDADO}</div>
      <h3>Caja fuerte cerrada</h3>
      <input type="password" id="cjSecreto" placeholder="${est.tipo === 'clave' ? 'Contraseña' : 'PIN'}" ${est.tipo === 'pin' ? 'inputmode="numeric" maxlength="8"' : 'class="clave" maxlength="128"'} autocomplete="off">
      <div class="caja-error" id="cjError"></div>
      <button class="btn-primary" id="cjAbrir">Abrir</button>
      <button class="enlace" id="cjOlvido">¿Lo has olvidado?</button>
    </div>`;
    const abrir = async () => {
      const i = document.getElementById('cjSecreto');
      const r = await caja('abrir', { secreto: i.value });
      if (r.error) {
        document.getElementById('cjError').textContent = r.error;
        const c = document.getElementById('cjCandado'); c.classList.remove('temblor'); void c.offsetWidth; c.classList.add('temblor');
        i.value = ''; i.focus(); return;
      }
      cajaNotas = r.notas; pintarCaja(r);
    };
    document.getElementById('cjAbrir').onclick = abrir;
    document.getElementById('cjSecreto').addEventListener('keydown', (e) => { if (e.key === 'Enter') abrir(); });
    document.getElementById('cjOlvido').onclick = () => confirmar('Borrar la caja fuerte',
      'Sin el PIN o la contraseña no se puede abrir: nadie puede recuperarlo. Si la borras pierdes todas sus notas y puedes crear otra.', 'Borrar todo',
      async () => { pintarCaja(await caja('borrar')); });
    setTimeout(() => document.getElementById('cjSecreto').focus(), 0);
    return;
  }
  // Abierta
  v.innerHTML = `<div class="caja-abierta">
    <div class="apuntar">
      <input type="text" id="cjTitulo" maxlength="120" placeholder="Título (p. ej. Wifi de la oficina)">
      <button class="btn-ghost" id="cjCerrar" title="Cerrarla ya" style="white-space:nowrap">Cerrar caja</button>
    </div>
    <textarea id="cjTexto" maxlength="8000" rows="3" placeholder="Lo que quieras guardar seguro…"></textarea>
    <div style="display:flex;gap:8px"><div style="flex:1" class="caja-aviso" id="cjAviso">Se cierra sola a los 5 minutos sin usarla.</div><button class="btn-primary" id="cjGuardar">Guardar</button></div>
    <div class="caja-lista" id="cjLista"></div>
  </div>`;
  let editando = null;
  const lista = document.getElementById('cjLista');
  const pintarLista = () => {
    lista.innerHTML = '';
    if (!cajaNotas.length) { lista.innerHTML = '<div class="carril-vacio">Todavía no hay nada guardado.</div>'; return; }
    cajaNotas.slice().sort((a, b) => (b.editada || 0) - (a.editada || 0)).forEach(n => {
      const el = document.createElement('div'); el.className = 'nota segura';
      el.innerHTML = `<div class="nota-titulo">${esc(n.titulo || 'Sin título')}</div><div class="nota-texto">${esc(n.texto)}</div>
        <div class="nota-acc"><button title="Copiar" data-a="copiar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button><button title="Editar" data-a="editar">${ICO.editar}</button><button class="peligro" title="Borrar" data-a="borrar">${ICO.borrar}</button></div>`;
      el.querySelector('.nota-acc').onclick = (e) => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.a === 'copiar') { try { require('electron').clipboard.writeText(n.texto); document.getElementById('cjAviso').textContent = 'Copiado'; } catch {} }
        if (b.dataset.a === 'editar') { editando = n.id; document.getElementById('cjTitulo').value = n.titulo; document.getElementById('cjTexto').value = n.texto; document.getElementById('cjGuardar').textContent = 'Guardar cambios'; document.getElementById('cjTexto').focus(); }
        if (b.dataset.a === 'borrar') confirmar('Borrar nota segura', `«${n.titulo || 'Sin título'}» se borra para siempre.`, 'Borrar', () => guardar(cajaNotas.filter(x => x.id !== n.id)));
      };
      lista.appendChild(el);
    });
  };
  const guardar = async (nueva) => {
    const r = await caja('guardar', { notas: nueva });
    if (r.error) { document.getElementById('cjAviso').textContent = r.error; caja('estado').then(pintarCaja); return; }
    cajaNotas = r.notas; pintarLista();
  };
  document.getElementById('cjGuardar').onclick = () => {
    const titulo = document.getElementById('cjTitulo').value.trim(), texto = document.getElementById('cjTexto').value;
    if (!titulo && !texto.trim()) return;
    const nueva = editando ? cajaNotas.map(x => x.id === editando ? { ...x, titulo, texto } : x) : [{ titulo, texto, creada: Date.now() }, ...cajaNotas];
    editando = null;
    document.getElementById('cjTitulo').value = ''; document.getElementById('cjTexto').value = '';
    document.getElementById('cjGuardar').textContent = 'Guardar';
    guardar(nueva);
  };
  document.getElementById('cjCerrar').onclick = async () => { cajaNotas = null; pintarCaja(await caja('cerrar')); };
  // Mientras se usa, no se cierra sola.
  let ultimoToque = 0;
  v.oninput = v.onclick = () => { if (Date.now() - ultimoToque > 20000) { ultimoToque = Date.now(); caja('tocar'); } };
  pintarLista();
  setTimeout(() => document.getElementById('cjTitulo').focus(), 0);
}
</script>
