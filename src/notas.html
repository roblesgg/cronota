<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  /* 2.16: Notas. Notas sueltas en un mapa flotante: cada una donde la dejes, con sus propiedades
     (urgencia, recordatorio, sección, color). Y una caja fuerte cifrada aparte. */
  html, body { width:100%;height:100%; }
  body { border-radius:var(--radius);overflow:hidden; }
  .app { width:100%;height:100%;padding:24px;display:flex;flex-direction:column;gap:12px;position:relative;min-height:0;-webkit-app-region:no-drag; }
  .app-title { font-size:16px;font-weight:700;-webkit-app-region:drag;display:flex;align-items:center;gap:8px;flex-shrink:0; }
  .cabecera { display:flex;align-items:center;gap:8px;flex-shrink:0; }
  body:not(.embedded) .cabecera { padding-right:34px; }   /* la X de cerrar la ventana */
  .cabecera .app-title { flex:1; }
  .btn-pildora {
    display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--border);
    background:var(--bg2);color:var(--text2);font:inherit;font-size:12px;font-weight:650;cursor:pointer;-webkit-app-region:no-drag;white-space:nowrap;
    transition:background .15s, color .15s, transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .btn-pildora:hover { color:var(--text);background:var(--bg3);transform:translateY(-1px); }
  .btn-pildora.activo { color:var(--accent);border-color:color-mix(in srgb, var(--accent) 40%, transparent); }

  .apuntar { display:flex;gap:8px;align-items:center;flex-shrink:0; }
  .apuntar input { flex:1; }

  /* Filtros: no esconden nada, apagan lo que no encaja (todo sigue a la vista). */
  .filtros { display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex-shrink:0; }
  .chip-sec {
    display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--border);
    background:transparent;color:var(--text2);font:inherit;font-size:12px;font-weight:600;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .chip-sec i { width:8px;height:8px;border-radius:50%;background:var(--c, var(--text3)); }
  .chip-sec:hover { color:var(--text);background:var(--bg2); }
  .chip-sec.activo { color:var(--text);background:color-mix(in srgb, var(--c, var(--accent2)) 22%, transparent);border-color:color-mix(in srgb, var(--c, var(--accent2)) 45%, transparent); }
  .chip-sec.mas { border-style:dashed; }
  .filtros input.buscar { margin-left:auto;flex:0 1 150px;width:150px !important;min-width:90px;padding:6px 10px !important;font-size:12px !important; }

  /* El mapa: se arrastra el fondo para moverse, la rueda también; Ctrl + rueda acerca y aleja. */
  .mapa {
    flex:1;min-height:0;position:relative;overflow:hidden;border-radius:20px;cursor:grab;touch-action:none;
    border:1px solid var(--border);
    background-color:color-mix(in srgb, var(--bg2) 45%, transparent);
    background-image:radial-gradient(circle, color-mix(in srgb, var(--text) 14%, transparent) 1px, transparent 1.4px);
    background-size:24px 24px;
  }
  .mapa.moviendo { cursor:grabbing; }
  .lienzo { position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform; }
  .mapa-vacio[hidden] { display:none; }
  .mapa-vacio { position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--text3);font-size:13px;pointer-events:none;padding:20px; }
  .mapa-herr { position:absolute;right:10px;bottom:10px;display:flex;gap:4px;z-index:5; }
  .mapa-herr button {
    width:32px;height:32px;border-radius:12px;border:1px solid rgba(255,255,255,.14);color:var(--text);cursor:pointer;display:grid;place-items:center;
    background:color-mix(in srgb, var(--bg2) 70%, transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  }
  .mapa-herr button:hover { background:var(--bg3); }

  /* Nota de cristal */
  .nota {
    position:absolute;width:230px;border-radius:18px;padding:12px 13px 11px;cursor:grab;color:var(--text);user-select:none;
    background:
      radial-gradient(120% 80% at 20% 0%, rgba(255,255,255,.17), rgba(255,255,255,0) 60%),
      linear-gradient(160deg, color-mix(in srgb, var(--c) 34%, transparent), color-mix(in srgb, var(--c) 14%, transparent));
    -webkit-backdrop-filter:blur(12px) saturate(1.6); backdrop-filter:blur(12px) saturate(1.6);
    border:1px solid color-mix(in srgb, var(--c) 40%, rgba(255,255,255,.18));
    box-shadow:inset 0 1px 1px rgba(255,255,255,.35), 0 10px 22px -12px rgba(0,0,0,.6);
    transition:box-shadow .25s, opacity .3s, filter .3s, scale .35s cubic-bezier(.34,1.56,.64,1);
    animation:notaCae .55s cubic-bezier(.34,1.56,.64,1) both;
    --c:#8b93a7;
  }
  .nota:hover { box-shadow:inset 0 1px 1px rgba(255,255,255,.4), 0 16px 30px -14px rgba(0,0,0,.65); }
  .nota.cogida { cursor:grabbing;scale:1.04;box-shadow:inset 0 1px 1px rgba(255,255,255,.4), 0 26px 44px -16px rgba(0,0,0,.7);animation:none;z-index:4; }
  .nota.apagada { opacity:.22;filter:saturate(.4); }
  .nota.se-va { animation:notaSeVa .28s cubic-bezier(.4,0,1,1) both; }
  .nota.hecha { opacity:.55; }
  .nota.hecha .nota-texto { text-decoration:line-through; }
  @keyframes notaCae { from { opacity:0; transform:translateY(-12px) scale(.92); filter:blur(5px); } to { opacity:1; transform:none; filter:none; } }
  @keyframes notaSeVa { to { opacity:0; transform:scale(.88); filter:blur(6px); } }
  /* Urgencia alta: un halo que respira. */
  .nota.u-alta::after { content:'';position:absolute;inset:-3px;border-radius:21px;border:2px solid #f87171;opacity:.0;pointer-events:none;animation:halo 2.4s ease-in-out infinite; }
  @keyframes halo { 0%,100% { opacity:.15; } 50% { opacity:.7; } }

  .nota-texto { font-size:13.5px;line-height:1.4;white-space:pre-wrap;word-break:break-word; }
  /* Casillas propias: círculo de cristal; al marcarla se llena del acento y el check se dibuja. */
  .casilla { display:flex;gap:8px;align-items:flex-start;cursor:pointer;padding:2px 0;border-radius:8px; }
  .casilla .marca {
    width:17px;height:17px;flex-shrink:0;margin-top:1px;border-radius:50%;display:grid;place-items:center;
    border:1.5px solid color-mix(in srgb, var(--text) 45%, transparent);
    background:rgba(255,255,255,.06);box-shadow:inset 0 1px 1px rgba(255,255,255,.18);
    transition:background .25s, border-color .25s, transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .casilla .marca svg path { stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .3s ease .05s; }
  .casilla:hover .marca { transform:scale(1.1);border-color:var(--text); }
  .casilla.marcada .marca { background:var(--accent);border-color:var(--accent); }
  .casilla.marcada .marca svg path { stroke-dashoffset:0; }
  .casilla .t { transition:opacity .25s; }
  .casilla.marcada .t { text-decoration:line-through;opacity:.55; }

  .nota-meta { display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;align-items:center; }
  .etq { font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.2);color:var(--text);display:inline-flex;align-items:center;gap:5px;white-space:nowrap; }
  .etq.u-baja { background:color-mix(in srgb, #60a5fa 36%, transparent); }
  .etq.u-media { background:color-mix(in srgb, #fbbf24 38%, transparent); }
  .etq.u-alta { background:color-mix(in srgb, #f87171 45%, transparent); }
  .etq.rec-hoy { background:color-mix(in srgb, #fbbf24 30%, transparent); }
  .etq.rec-vencido { background:color-mix(in srgb, #f87171 40%, transparent); }
  .nota-acc { position:absolute;top:-12px;right:8px;display:flex;gap:3px;opacity:0;transform:translateY(4px) scale(.9);transition:opacity .15s, transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none; }
  .nota:hover .nota-acc { opacity:1;transform:none;pointer-events:auto; }
  .nota.cogida .nota-acc { opacity:0; }
  .nota-acc button {
    width:26px;height:26px;border-radius:9px;border:1px solid rgba(255,255,255,.18);color:var(--text);display:grid;place-items:center;cursor:pointer;
    background:color-mix(in srgb, var(--bg2) 82%, transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 6px 14px -8px rgba(0,0,0,.6);
  }
  .nota-acc button:hover { background:var(--bg3); }
  .nota-acc button.peligro:hover { background:var(--danger, #e5484d);color:#fff; }

  /* Popups */
  .pop-nota { width:390px; }
  .pop-nota textarea { min-height:110px;resize:vertical; }
  .fila { display:flex;gap:8px;align-items:center;flex-wrap:wrap; }
  .fila > label.et, .fila > span.et { font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);min-width:80px; }
  .seg { display:flex;background:var(--bg2);border-radius:999px;padding:3px;gap:2px; }
  .seg button { border:none;background:transparent;color:var(--text2);font:inherit;font-size:11.5px;font-weight:650;padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px; }
  .seg button i { width:7px;height:7px;border-radius:50%; }
  .seg button.activo { background:color-mix(in srgb, var(--accent2) 26%, transparent);color:var(--text); }
  .colores { display:flex;gap:5px;flex-wrap:wrap; }
  .colores button { width:20px;height:20px;border-radius:50%;border:none;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);transition:transform .25s cubic-bezier(.34,1.56,.64,1); }
  .colores button:hover { transform:scale(1.15); }
  .colores button.sel { outline:2px solid var(--text);outline-offset:1px; }
  .colores button.ninguno { background:transparent;border:1.5px dashed var(--text3); }
  /* La fecha del recordatorio, con la letra de la app y el calendario en el tema de la app. */
  #pnRecordatorio { font:inherit;font-size:13px;font-weight:600;color-scheme:dark;padding:10px 14px;background:var(--bg2) !important;border:1px solid transparent !important;border-radius:14px;color:var(--text); }
  :root[data-scheme="light"] #pnRecordatorio { color-scheme:light; }
  #pnRecordatorio::-webkit-calendar-picker-indicator { opacity:.6;cursor:pointer; }
  .rapidos { display:flex;gap:5px;flex-wrap:wrap; }
  .rapidos button { border:1px solid var(--border);background:transparent;color:var(--text2);font:inherit;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;cursor:pointer; }
  .rapidos button:hover { color:var(--text);background:var(--bg2); }

  /* Caja fuerte */
  .caja { flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;animation:notaCae .45s cubic-bezier(.34,1.56,.64,1) both; }
  .caja[hidden] { display:none; }
  .caja-cerrada { flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:10px; }
  .candado {
    width:84px;height:84px;border-radius:28px;display:grid;place-items:center;color:var(--accent);
    background:radial-gradient(120% 80% at 30% 0%, rgba(255,255,255,.22), rgba(255,255,255,0) 60%), color-mix(in srgb, var(--accent2) 18%, transparent);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.18); box-shadow:inset 0 1px 1px rgba(255,255,255,.35), 0 14px 30px -14px rgba(0,0,0,.6);
  }
  .candado.temblor { animation:temblor .4s; }
  @keyframes temblor { 20%,60% { transform:translateX(-6px); } 40%,80% { transform:translateX(6px); } }
  .caja-cerrada h3 { margin:0;font-size:17px; }
  .caja-cerrada p { margin:0;font-size:12.5px;color:var(--text2);max-width:300px;line-height:1.45; }
  .caja-cerrada input { width:230px !important;padding:11px 14px !important;text-align:center;font-size:16px !important;letter-spacing:.2em; }
  .caja-cerrada input.clave { letter-spacing:.05em; }
  .caja-cerrada input::placeholder { letter-spacing:normal;font-size:13px; }
  .caja-error { color:var(--danger, #e5484d);font-size:12.5px;min-height:16px; }
  .enlace { background:none;border:none;color:var(--text3);font:inherit;font-size:11.5px;cursor:pointer;text-decoration:underline; }
  .caja-abierta { flex:1;min-height:0;display:flex;flex-direction:column;gap:10px; }
  .caja-lista { flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:14px 6px 6px 2px; }
  .nota.segura { position:relative;width:auto;--c:#8b5cf6;cursor:default;user-select:text; }
  .nota.segura .nota-titulo { font-weight:700;font-size:13.5px;margin-bottom:3px; }
  .caja-aviso { font-size:11.5px;color:var(--text3); }
  .vacio { font-size:12.5px;color:var(--text3);text-align:center;padding:16px; }
</style>
<link rel="stylesheet" href="mac.css">
</head>
<body>
<div class="app animate-in">
  <div class="win-drag" title="Arrastra para mover la ventana"></div>
  <div class="win-controls">
    <button class="win-btn close" onclick="ipcRenderer.send('action', { type: 'close-notas' })" title="Cerrar">
      <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="cabecera">
    <div class="app-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5z"/><path d="M15 3v5a1 1 0 0 0 1 1h5"/><path d="M7 13h7M7 17h4"/></svg>
      <span id="titulo">Notas</span>
    </div>
    <button class="btn-pildora" id="btnCaja" onclick="alternarCaja()" title="Notas protegidas con PIN o contraseña">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span>Caja fuerte</span>
    </button>
  </div>

  <!-- Mapa de notas -->
  <div id="vistaMapa" style="display:flex;flex-direction:column;gap:12px;flex:1;min-height:0">
    <div class="apuntar">
      <input type="text" id="apuntarInput" maxlength="4000" placeholder="Apunta algo y Enter: cae en el centro del mapa" autocomplete="off">
    </div>
    <div class="filtros" id="filtros"></div>
    <div class="mapa" id="mapa">
      <div class="lienzo" id="lienzo"></div>
      <div class="mapa-vacio" id="mapaVacio" hidden>Tu mapa está vacío.<br>Apunta algo arriba y colócalo donde quieras.</div>
      <div class="mapa-herr">
        <button type="button" title="Alejar" onclick="zoomEn(-0.15)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button type="button" title="Acercar" onclick="zoomEn(0.15)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button type="button" title="Ver todas las notas" onclick="encuadrar(true)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      </div>
    </div>
  </div>

  <!-- Caja fuerte -->
  <div class="caja" id="vistaCaja" hidden></div>
</div>

<!-- Propiedades de una nota -->
<div class="popup-backdrop" id="popNotaFondo" style="display:none" onclick="cerrarPopNota()"></div>
<div class="entry-popup pop-nota" id="popNota" style="display:none">
  <div class="entry-popup-title">Nota</div>
  <textarea id="pnTexto" maxlength="4000" placeholder="Escribe la nota… (una línea que empiece por [ ] es una casilla)"></textarea>
  <div class="fila"><span class="et">Urgencia</span>
    <div class="seg" id="pnUrgencia">
      <button type="button" data-u="">Ninguna</button>
      <button type="button" data-u="baja"><i style="background:#60a5fa"></i>Baja</button>
      <button type="button" data-u="media"><i style="background:#fbbf24"></i>Media</button>
      <button type="button" data-u="alta"><i style="background:#f87171"></i>Alta</button>
    </div>
  </div>
  <div class="fila"><label class="et" for="pnRecordatorio">Recordar</label><input type="datetime-local" id="pnRecordatorio" style="flex:1"></div>
  <div class="rapidos" id="pnRapidos">
    <button type="button" data-r="1h">En 1 hora</button>
    <button type="button" data-r="tarde">Esta tarde 17:00</button>
    <button type="button" data-r="manana">Mañana 9:00</button>
    <button type="button" data-r="quitar">Sin recordatorio</button>
  </div>
  <div class="fila"><label class="et" for="pnSeccion">Sección</label><select id="pnSeccion" style="flex:1"></select></div>
  <div class="fila"><span class="et">Color</span><div class="colores" id="pnColores"></div></div>
  <div class="entry-popup-actions">
    <button class="btn-danger" onclick="borrarDesdePop()">Borrar</button>
    <div style="flex:1"></div>
    <button class="btn-ghost" onclick="cerrarPopNota()">Cancelar</button>
    <button class="btn-primary" onclick="guardarPopNota()">Guardar</button>
  </div>
</div>

<!-- Sección de notas -->
<div class="popup-backdrop" id="popSecFondo" style="display:none" onclick="cerrarPopSec()"></div>
<div class="entry-popup" id="popSec" style="display:none;width:320px">
  <div class="entry-popup-title" id="popSecTitulo">Nueva sección</div>
  <input type="text" id="psNombre" maxlength="40" placeholder="Nombre (p. ej. un cliente o un tema)">
  <div class="colores" id="psColores"></div>
  <div class="entry-popup-actions">
    <button class="btn-danger" id="psBorrar" onclick="borrarSeccion()">Borrar</button>
    <div style="flex:1"></div>
    <button class="btn-ghost" onclick="cerrarPopSec()">Cancelar</button>
    <button class="btn-primary" onclick="guardarSeccion()">Guardar</button>
  </div>
</div>

<!-- Confirmar -->
<div class="popup-backdrop" id="popConfFondo" style="display:none;z-index:60" onclick="cerrarConf()"></div>
<div class="entry-popup" id="popConf" style="display:none;width:320px;z-index:61">
  <div class="entry-popup-title" id="confTitulo"></div>
  <div style="font-size:13px;color:var(--text2);line-height:1.45" id="confTexto"></div>
  <div class="entry-popup-actions">
    <div style="flex:1"></div>
    <button class="btn-ghost" onclick="cerrarConf()">Cancelar</button>
    <button class="btn-danger" id="confOk">Aceptar</button>
  </div>
</div>

<script src="shared.js"></script>
<script src="movimiento.js"></script>
<script src="glass.js"></script>
<script>
const { ipcRenderer } = require('electron');
let currentState = null;
let filtroSeccion = '';      // '' = todas (los filtros apagan, no esconden)
let busqueda = '';
let verHechas = false;
const ANCHO_NOTA = 230;
const COLORES_NOTA = ['#f87171', '#fb923c', '#fbbf24', '#a3e635', '#34d399', '#2dd4bf', '#38bdf8', '#60a5fa', '#818cf8', '#a78bfa', '#e879f9', '#f472b6'];
const URGENCIAS = { baja: 'Baja', media: 'Media', alta: 'Urgente' };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enviar = (type, payload) => ipcRenderer.send('action', { type, payload });

const mapa = document.getElementById('mapa');
const lienzo = document.getElementById('lienzo');

// ── Vista del mapa (desplazamiento y zoom), recordada en este equipo ──────────
let vista = { x: 40, y: 30, z: 1 };
try { const v = JSON.parse(localStorage.getItem('notas.vista') || 'null'); if (v && Number.isFinite(v.x) && Number.isFinite(v.y) && Number.isFinite(v.z)) vista = v; } catch {}
let primeraVez = !(() => { try { return localStorage.getItem('notas.vista'); } catch { return null; } })();
function aplicarVista() {
  lienzo.style.transform = `translate(${vista.x}px, ${vista.y}px) scale(${vista.z})`;
  mapa.style.backgroundPosition = `${vista.x}px ${vista.y}px`;
  mapa.style.backgroundSize = `${24 * vista.z}px ${24 * vista.z}px`;
  try { localStorage.setItem('notas.vista', JSON.stringify(vista)); } catch {}
}
function zoomEn(d, cx, cy) {
  const r = mapa.getBoundingClientRect();
  const px = cx == null ? r.width / 2 : cx - r.left, py = cy == null ? r.height / 2 : cy - r.top;
  const z = Math.max(0.4, Math.min(1.6, vista.z + d));
  vista.x = px - (px - vista.x) * (z / vista.z);
  vista.y = py - (py - vista.y) * (z / vista.z);
  vista.z = z;
  lienzo.style.transition = cx == null ? 'transform .35s cubic-bezier(.22,1,.36,1)' : '';
  aplicarVista();
}
// Que se vean todas: encuadra la caja que las contiene.
function encuadrar(animado) {
  const ns = notasVisibles();
  if (!ns.length) { vista = { x: 40, y: 30, z: 1 }; aplicarVista(); return; }

  const z = Math.max(0.4, Math.min(1, Math.min((r.width - 40) / (maxX - minX), (r.height - 40) / (maxY - minY))));
  vista = { z, x: (r.width - (maxX - minX) * z) / 2 - minX * z, y: (r.height - (maxY - minY) * z) / 2 - minY * z };

function seccionDe(id) { return ((currentState && currentState.seccionesNotas) || []).find(s => s.id === id) || null; }
// Las que aún no tienen sitio (vienen de antes del mapa) se colocan en rejilla.
function conSitio(lista) {
  let k = 0;
  return lista.map(n => (Number.isFinite(n.x) && Number.isFinite(n.y)) ? n : { ...n, x: (k % 3) * 260, y: Math.floor(k++ / 3) * 170 });

function notasVisibles() { return conSitio((currentState && currentState.notas) || []).filter(n => verHechas || !n.hecha); }
function encaja(n) { return (!filtroSeccion || n.seccion === filtroSeccion) && (!busqueda || n.texto.toLowerCase().includes(busqueda)); }
// Cada segundo llega el estado (por los tiempos de las tareas): solo se repinta si cambia algo de
// las notas, y nunca con una nota cogida (se soltaría de la mano).
let arrastrandoNota = false, firmaPintada = '';
function pintar(forzar) {
  if (!currentState || arrastrandoNota) return;
  const firma = JSON.stringify([currentState.notas, currentState.seccionesNotas, filtroSeccion, busqueda, verHechas, new Date().getMinutes()]);
  if (!forzar && firma === firmaPintada) return;

  const ya = new Map([...lienzo.querySelectorAll('.nota')].map(el => [el.dataset.id, el]));
  const quedan = new Set();
  vistas.forEach((n, i) => {
    const nueva = tarjeta(n);
    nueva.style.zIndex = String(i + 1);
    const vieja = ya.get(n.id);
    if (vieja) { nueva.style.animation = 'none'; vieja.replaceWith(nueva); } else lienzo.appendChild(nueva);
    quedan.add(n.id);

    h.textContent = `Hechas (${nHechas})`; h.title = verHechas ? 'Esconderlas' : 'Enseñarlas en el mapa';
    h.onclick = () => { verHechas = !verHechas; pintar(); };

function textoRecordatorio(ms) {
  const d = new Date(ms), hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const dia = new Date(d); dia.setHours(0, 0, 0, 0);
  const diff = Math.round((dia - hoy) / 86400000);
  const hora = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  if (diff === 0) return 'Hoy ' + hora;
  if (diff === 1) return 'Mañana ' + hora;
  if (diff === -1) return 'Ayer ' + hora;
  return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) + ' ' + hora;
}

function tarjeta(n) {
  const el = document.createElement('div');
  el.className = 'nota' + (n.hecha ? ' hecha' : '') + (n.urgencia === 'alta' && !n.hecha ? ' u-alta' : '') + (encaja(n) ? '' : ' apagada');
  el.dataset.id = n.id;
  el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
  const sec = seccionDe(n.seccion);
  const color = n.color || (sec && sec.color);
  if (color) el.style.setProperty('--c', color);
  // Texto, con las líneas «[ ]» / «[x]» como casillas (propias, no las del sistema).
  const txt = document.createElement('div'); txt.className = 'nota-texto';
  n.texto.split('\n').forEach((linea, i, todas) => {
    const m = linea.match(/^\s*(?:-\s*)?\[( |x|X)\]\s?(.*)$/);
    if (m) {
      const fila = document.createElement('div');
      const hecho = m[1] !== ' ';
      fila.className = 'casilla' + (hecho ? ' marcada' : '');
      fila.setAttribute('role', 'checkbox'); fila.setAttribute('aria-checked', String(hecho)); fila.tabIndex = 0;
      fila.innerHTML = `<span class="marca">${ICO.check}</span><span class="t">${esc(m[2])}</span>`;
      const alternar = (e) => {
        e.stopPropagation();
        fila.classList.toggle('marcada');
        const lineas = n.texto.split('\n');
        lineas[i] = linea.replace(/\[( |x|X)\]/, fila.classList.contains('marcada') ? '[x]' : '[ ]');
        setTimeout(() => enviar('nota-editar', { id: n.id, texto: lineas.join('\n') }), 320);   // que se vea el check dibujarse
      };
      fila.addEventListener('pointerdown', (e) => e.stopPropagation());
      fila.onclick = alternar;
      fila.onkeydown = (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); alternar(e); } };
      txt.appendChild(fila);
    } else {
      txt.appendChild(document.createTextNode(linea + (i < todas.length - 1 ? '\n' : '')));
    }
  });
  el.appendChild(txt);
  const meta = document.createElement('div'); meta.className = 'nota-meta';
  if (n.urgencia && URGENCIAS[n.urgencia]) meta.insertAdjacentHTML('beforeend', `<span class="etq u-${n.urgencia}">${URGENCIAS[n.urgencia]}</span>`);
  if (n.recordatorio) {
    const d = new Date(n.recordatorio);
    const clase = !n.hecha && n.recordatorio <= Date.now() ? ' rec-vencido' : (d.toDateString() === new Date().toDateString() ? ' rec-hoy' : '');
    meta.insertAdjacentHTML('beforeend', `<span class="etq${clase}">${ICO.reloj}${textoRecordatorio(n.recordatorio)}</span>`);
  }
  if (sec) meta.insertAdjacentHTML('beforeend', `<span class="etq">${esc(sec.name)}</span>`);
  if (meta.children.length) el.appendChild(meta);
  const acc = document.createElement('div'); acc.className = 'nota-acc';
  acc.innerHTML = `<button title="${n.hecha ? 'Volver a pendiente' : 'Hecha'}" data-a="hecha">${n.hecha ? ICO.deshecha : ICO.hecha}</button><button title="Propiedades: urgencia, recordatorio, sección, color" data-a="editar">${ICO.editar}</button><button class="peligro" title="Borrar (Ctrl+Z lo deshace)" data-a="borrar">${ICO.borrar}</button>`;
  acc.addEventListener('pointerdown', (e) => e.stopPropagation());
  acc.onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    e.stopPropagation();
    if (b.dataset.a === 'editar') abrirPopNota(n.id);
    else if (b.dataset.a === 'hecha') irse(el, () => enviar('nota-editar', { id: n.id, hecha: !n.hecha }), !verHechas && !n.hecha);
    else if (b.dataset.a === 'borrar') irse(el, () => enviar('nota-borrar', { id: n.id }), true);
  };
  el.appendChild(acc);
  el.ondblclick = (e) => { e.stopPropagation(); abrirPopNota(n.id); };
  // Arrastrar la nota por el mapa (sin el arrastre del sistema: se mueve fina, con el zoom).
  el.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.stopPropagation();
    const ini = { cx: e.clientX, cy: e.clientY, x: n.x, y: n.y };
    let movida = false;
    el.setPointerCapture(e.pointerId);
    const mover = (ev) => {
      const dx = (ev.clientX - ini.cx) / vista.z, dy = (ev.clientY - ini.cy) / vista.z;
      if (!movida && Math.hypot(dx, dy) < 3) return;
      if (!movida) { movida = true; arrastrandoNota = true; el.classList.add('cogida'); el.style.zIndex = '9999'; }
      el.style.left = (ini.x + dx) + 'px'; el.style.top = (ini.y + dy) + 'px';
    };
    const soltar = () => {
      el.removeEventListener('pointermove', mover); el.removeEventListener('pointerup', soltar); el.removeEventListener('pointercancel', soltar);
      if (!movida) return;
      arrastrandoNota = false;
      el.classList.remove('cogida');
      enviar('nota-mover', { id: n.id, x: parseFloat(el.style.left), y: parseFloat(el.style.top) });
    };
    el.addEventListener('pointermove', mover); el.addEventListener('pointerup', soltar); el.addEventListener('pointercancel', soltar);
  });
  return el;
}

async function alternarCaja() {
  enCaja = !enCaja;
  document.getElementById('vistaMapa').style.display = enCaja ? 'none' : 'flex';
  document.getElementById('vistaCaja').hidden = !enCaja;
  document.getElementById('titulo').textContent = enCaja ? 'Caja fuerte' : 'Notas';
  pintarBotonCaja();
  if (enCaja) pintarCaja(await caja('estado'));
}
ipcRenderer.on('caja-cerrada', () => { cajaNotas = null; if (enCaja) caja('estado').then(pintarCaja); });

const CANDADO = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><circle cx="12" cy="16" r="1.3" fill="currentColor"/></svg>';
function pintarCaja(est) {
  const v = document.getElementById('vistaCaja');
  if (!est || !est.existe) {
    v.innerHTML = `<div class="caja-cerrada">
      <div class="candado">${CANDADO}</div>
      <h3>Crea tu caja fuerte</h3>
      <p>Notas que nadie ve sin tu PIN o tu contraseña. Se guardan cifradas: si lo olvidas, no hay forma de recuperarlas.</p>
      <div class="seg" id="cjTipo"><button type="button" data-t="pin">PIN</button><button type="button" data-t="clave">Contraseña</button></div>
      <input type="password" id="cj1" autocomplete="new-password">
      <input type="password" id="cj2" autocomplete="new-password">
      <div class="caja-error" id="cjError"></div>
      <button class="btn-primary" id="cjCrear">Crear caja fuerte</button>
    </div>`;
    const ponerTipo = (t) => {
      cajaTipoNuevo = t;
      v.querySelectorAll('#cjTipo button').forEach(b => b.classList.toggle('activo', b.dataset.t === t));
      ['cj1', 'cj2'].forEach((id, i) => { const el = document.getElementById(id); el.inputMode = t === 'pin' ? 'numeric' : 'text'; el.maxLength = t === 'pin' ? 8 : 128; el.classList.toggle('clave', t === 'clave'); el.placeholder = (t === 'pin' ? 'PIN de 4 a 8 números' : 'Contraseña (mín. 6)') + (i ? ' · otra vez' : ''); });
    };
    v.querySelectorAll('#cjTipo button').forEach(b => b.onclick = () => ponerTipo(b.dataset.t));
    ponerTipo(cajaTipoNuevo);
    const crear = async () => {
      const a = document.getElementById('cj1').value, b = document.getElementById('cj2').value;
      const err = document.getElementById('cjError');
      if (a !== b) { err.textContent = 'No coinciden'; return; }
      const r = await caja('crear', { secreto: a, tipo: cajaTipoNuevo });
      if (r.error) { err.textContent = r.error; return; }
      cajaNotas = r.notas; pintarCaja(r);
    };
    document.getElementById('cjCrear').onclick = crear;
    document.getElementById('cj2').addEventListener('keydown', (e) => { if (e.key === 'Enter') crear(); });
    setTimeout(() => document.getElementById('cj1').focus(), 0);
    return;
  }
  if (!est.abierta || !cajaNotas) {
    cajaNotas = null;
    v.innerHTML = `<div class="caja-cerrada">
      <div class="candado" id="cjCandado">${CANDADO}</div>
      <h3>Caja fuerte cerrada</h3>
      <input type="password" id="cjSecreto" placeholder="${est.tipo === 'clave' ? 'Contraseña' : 'PIN'}" ${est.tipo === 'pin' ? 'inputmode="numeric" maxlength="8"' : 'class="clave" maxlength="128"'} autocomplete="off">
      <div class="caja-error" id="cjError"></div>
      <button class="btn-primary" id="cjAbrir">Abrir</button>
      <button class="enlace" id="cjOlvido">¿Lo has olvidado?</button>
    </div>`;
    const abrir = async () => {
      const i = document.getElementById('cjSecreto');
      const r = await caja('abrir', { secreto: i.value });
      if (r.error) {
        document.getElementById('cjError').textContent = r.error;
        const c = document.getElementById('cjCandado'); c.classList.remove('temblor'); void c.offsetWidth; c.classList.add('temblor');
        i.value = ''; i.focus(); return;
      }
      cajaNotas = r.notas; pintarCaja(r);
    };
    document.getElementById('cjAbrir').onclick = abrir;
    document.getElementById('cjSecreto').addEventListener('keydown', (e) => { if (e.key === 'Enter') abrir(); });
    document.getElementById('cjOlvido').onclick = () => confirmar('Borrar la caja fuerte',
      'Sin el PIN o la contraseña no se puede abrir: nadie puede recuperarlo. Si la borras pierdes todas sus notas y puedes crear otra.', 'Borrar todo',
      async () => { pintarCaja(await caja('borrar')); });
    setTimeout(() => document.getElementById('cjSecreto').focus(), 0);
    return;
  }
  // Abierta
  v.innerHTML = `<div class="caja-abierta">
    <div class="apuntar">
      <input type="text" id="cjTitulo" maxlength="120" placeholder="Título (p. ej. Wifi de la oficina)">
      <button class="btn-ghost" id="cjCerrar" title="Cerrarla ya" style="white-space:nowrap">Cerrar caja</button>
    </div>
    <textarea id="cjTexto" maxlength="8000" rows="3" placeholder="Lo que quieras guardar seguro…"></textarea>
    <div style="display:flex;gap:8px;align-items:center"><div style="flex:1" class="caja-aviso" id="cjAviso">Se cierra sola a los 5 minutos sin usarla.</div><button class="btn-primary" id="cjGuardar">Guardar</button></div>
    <div class="caja-lista" id="cjLista"></div>
  </div>`;
  let editando = null;
  const lista = document.getElementById('cjLista');
  const pintarLista = () => {
    lista.innerHTML = '';
    if (!cajaNotas.length) { lista.innerHTML = '<div class="vacio">Todavía no hay nada guardado.</div>'; return; }
    cajaNotas.slice().sort((a, b) => (b.editada || 0) - (a.editada || 0)).forEach(n => {
      const el = document.createElement('div'); el.className = 'nota segura';
      el.innerHTML = `<div class="nota-titulo">${esc(n.titulo || 'Sin título')}</div><div class="nota-texto">${esc(n.texto)}</div>
        <div class="nota-acc"><button title="Copiar" data-a="copiar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button><button title="Editar" data-a="editar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button><button class="peligro" title="Borrar" data-a="borrar">${ICO.borrar}</button></div>`;
      el.querySelector('.nota-acc').onclick = (e) => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.a === 'copiar') { try { require('electron').clipboard.writeText(n.texto); document.getElementById('cjAviso').textContent = 'Copiado'; } catch {} }
        if (b.dataset.a === 'editar') { editando = n.id; document.getElementById('cjTitulo').value = n.titulo; document.getElementById('cjTexto').value = n.texto; document.getElementById('cjGuardar').textContent = 'Guardar cambios'; document.getElementById('cjTexto').focus(); }
        if (b.dataset.a === 'borrar') confirmar('Borrar nota segura', `«${n.titulo || 'Sin título'}» se borra para siempre.`, 'Borrar', () => guardar(cajaNotas.filter(x => x.id !== n.id)));
      };
      lista.appendChild(el);
    });
  };
  const guardar = async (nueva) => {
    const r = await caja('guardar', { notas: nueva });
    if (r.error) { document.getElementById('cjAviso').textContent = r.error; caja('estado').then(pintarCaja); return; }
    cajaNotas = r.notas; pintarLista();
  };
  document.getElementById('cjGuardar').onclick = () => {
    const titulo = document.getElementById('cjTitulo').value.trim(), texto = document.getElementById('cjTexto').value;
    if (!titulo && !texto.trim()) return;
    const nueva = editando ? cajaNotas.map(x => x.id === editando ? { ...x, titulo, texto } : x) : [{ titulo, texto, creada: Date.now() }, ...cajaNotas];
    editando = null;
    document.getElementById('cjTitulo').value = ''; document.getElementById('cjTexto').value = '';
    document.getElementById('cjGuardar').textContent = 'Guardar';
    guardar(nueva);
  };
  document.getElementById('cjCerrar').onclick = async () => { cajaNotas = null; pintarCaja(await caja('cerrar')); };
  // Mientras se usa, no se cierra sola.
  let ultimoToque = 0;
  v.oninput = v.onclick = () => { if (Date.now() - ultimoToque > 20000) { ultimoToque = Date.now(); caja('tocar'); } };
  pintarLista();
  setTimeout(() => document.getElementById('cjTitulo').focus(), 0);
}
</script>
</body>
</html>
