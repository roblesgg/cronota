<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  /* 2.16: Notas. Notas sueltas en un mapa flotante: cada una donde la dejes, con sus propiedades
     (urgencia, recordatorio, sección, color). Y una caja fuerte cifrada aparte. */
  html, body { width:100%;height:100%; }
  body { border-radius:var(--radius);overflow:hidden; }
  .app { width:100%;height:100%;padding:24px;display:flex;flex-direction:column;gap:12px;position:relative;min-height:0;-webkit-app-region:no-drag; }
  .app-title { font-size:16px;font-weight:700;-webkit-app-region:drag;display:flex;align-items:center;gap:8px;flex-shrink:0; }
  .cabecera { display:flex;align-items:center;gap:8px;flex-shrink:0; }
  body:not(.embedded) .cabecera { padding-right:34px; }   /* la X de cerrar la ventana */
  .cabecera .app-title { flex:1; }
  .btn-pildora {
    display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--border);
    background:var(--bg2);color:var(--text2);font:inherit;font-size:12px;font-weight:650;cursor:pointer;-webkit-app-region:no-drag;white-space:nowrap;
    transition:background .15s, color .15s, transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .btn-pildora:hover { color:var(--text);background:var(--bg3);transform:translateY(-1px); }
  .btn-pildora.activo { color:var(--accent);border-color:color-mix(in srgb, var(--accent) 40%, transparent); }

  .btn-pildora.primaria { background:color-mix(in srgb, var(--accent2) 30%, transparent);color:var(--text);border-color:color-mix(in srgb, var(--accent) 45%, transparent); }

  /* Filtros: no esconden nada, apagan lo que no encaja (todo sigue a la vista). */
  .filtros { display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex-shrink:0; }
  .chip-sec {
    display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--border);
    background:transparent;color:var(--text2);font:inherit;font-size:12px;font-weight:600;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .chip-sec i { width:8px;height:8px;border-radius:50%;background:var(--c, var(--text3)); }
  .chip-sec:hover { color:var(--text);background:var(--bg2); }
  .chip-sec.activo { color:var(--text);background:color-mix(in srgb, var(--c, var(--accent2)) 22%, transparent);border-color:color-mix(in srgb, var(--c, var(--accent2)) 45%, transparent); }
  .chip-sec.mas { border-style:dashed; }
  .filtros input.buscar { margin-left:auto;flex:0 1 150px;width:150px !important;min-width:90px;padding:6px 10px !important;font-size:12px !important; }

  /* El mapa: se arrastra el fondo para moverse, la rueda también; Ctrl + rueda acerca y aleja. */
  .mapa {
    flex:1;min-height:0;position:relative;overflow:hidden;border-radius:20px;cursor:grab;touch-action:none;
    border:1px solid var(--border);
    background-color:color-mix(in srgb, var(--bg2) 45%, transparent);
    background-image:radial-gradient(circle, color-mix(in srgb, var(--text) 14%, transparent) 1px, transparent 1.4px);
    background-size:24px 24px;
  }
  .mapa.moviendo { cursor:grabbing; }
  .lienzo { position:absolute;left:0;top:0;transform-origin:0 0; }
  .mapa.moviendose .lienzo { will-change:transform; }
  .mapa-vacio[hidden] { display:none; }
  .mapa-vacio { position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--text3);font-size:13px;pointer-events:none;padding:20px; }
  .mapa-herr { position:absolute;right:10px;bottom:10px;display:flex;gap:4px;z-index:5; }
  .mapa-herr button, .modos button {
    width:32px;height:32px;border-radius:12px;border:1px solid rgba(255,255,255,.16);color:var(--text);cursor:pointer;display:grid;place-items:center;
    background:radial-gradient(120% 90% at 30% 0%, rgba(255,255,255,.22), rgba(255,255,255,0) 60%), color-mix(in srgb, var(--bg2) 45%, transparent);
    -webkit-backdrop-filter:blur(10px) saturate(1.6);backdrop-filter:blur(10px) saturate(1.6);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.4), 0 6px 14px -8px rgba(0,0,0,.55);
    transition:transform .3s cubic-bezier(.34,1.56,.64,1), color .15s, background .2s;
  }
  .mapa-herr button:hover, .modos button:hover { transform:scale(1.08); }
  /* Maneras de ordenar (arriba a la izquierda del mapa). */
  .modos { position:absolute;left:10px;top:10px;display:flex;gap:4px;z-index:5; }
  .pista-raton { position:absolute;right:10px;top:10px;z-index:5;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--text3);cursor:help;
    background:color-mix(in srgb, var(--bg2) 55%, transparent);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,.1);transition:color .2s; }
  .pista-raton:hover { color:var(--text); }
  .modos button { color:var(--text2); }
  .modos button.activo { color:var(--accent);background:radial-gradient(120% 90% at 30% 0%, rgba(255,255,255,.3), rgba(255,255,255,0) 60%), color-mix(in srgb, var(--accent2) 30%, transparent); }
  /* Transición entre maneras: las notas se deslizan a su sitio nuevo, una tras otra. */
  .lienzo.animando .nota { transition:left .65s cubic-bezier(.34,1.25,.64,1), top .65s cubic-bezier(.34,1.25,.64,1), width .5s cubic-bezier(.22,1,.36,1), height .5s cubic-bezier(.22,1,.36,1), opacity .3s, filter .3s; }
  .lienzo.ordenado .nota { cursor:grab; }
  /* Cuadrícula: todas del mismo alto. Se recorta solo el contenido (con fundido), no la nota: así
     los botones de arriba, que asoman por fuera, se siguen viendo. */
  .lienzo.m-cuadricula .nota { height:168px;display:flex;flex-direction:column; }
  .lienzo.m-cuadricula .nota > .nota-texto, .lienzo.m-cuadricula .nota > .archivo-prev { flex:1 1 auto;min-height:0;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%, transparent);mask-image:linear-gradient(#000 70%, transparent); }
  .lienzo.m-cuadricula .nota > .nota-meta { flex-shrink:0; }
  .grupo-cab { position:absolute;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);white-space:nowrap;animation:notaCae .5s cubic-bezier(.34,1.56,.64,1) both;pointer-events:none; }
  .grupo-cab i { width:8px;height:8px;border-radius:50%;background:var(--c, var(--text3)); }
  .grupo-cab span { color:var(--text3);font-weight:600; }
  .mapa-herr button:hover { background:var(--bg3); }

  /* Nota de cristal */
  .nota {
    position:absolute;width:230px;border-radius:18px;padding:12px 13px 11px;cursor:grab;color:var(--text);user-select:none;
    background:
      radial-gradient(120% 80% at 20% 0%, rgba(255,255,255,.17), rgba(255,255,255,0) 60%),
      linear-gradient(160deg, color-mix(in srgb, var(--c) 34%, transparent), color-mix(in srgb, var(--c) 14%, transparent));
    -webkit-backdrop-filter:blur(5px) saturate(1.7); backdrop-filter:blur(5px) saturate(1.7);
    border:1px solid color-mix(in srgb, var(--c) 40%, rgba(255,255,255,.18));
    box-shadow:inset 0 1px 1px rgba(255,255,255,.45), inset 0 0 0 1px rgba(255,255,255,.06), inset 0 -10px 18px -12px rgba(0,0,0,.35), inset 6px 0 10px -10px rgba(255,255,255,.35), 0 10px 22px -12px rgba(0,0,0,.6);
    transition:box-shadow .25s, opacity .3s, filter .3s, scale .35s cubic-bezier(.34,1.56,.64,1);
    animation:notaCae .42s cubic-bezier(.22,1,.36,1) both;
    --c:#8b93a7;
  }
  /* La deformación va solo en las notas (Álvaro: también mientras se mueven); los botones, solo desenfoque. */
  .mapa.moviendose .nota.u-alta::after { animation:none; }
  /* Cristal: la deformación real solo en la que tienes bajo el ratón o arrastras (es lo caro). */
  .nota:hover, .nota.cogida { -webkit-backdrop-filter:url(#vidrio) blur(4px) saturate(1.7); backdrop-filter:url(#vidrio) blur(4px) saturate(1.7); }
  .nota:hover { box-shadow:inset 0 1px 1px rgba(255,255,255,.4), 0 16px 30px -14px rgba(0,0,0,.65); }
  /* Notas con archivo (2.16). */
  .nota.con-archivo { padding:8px 8px 10px; }
  .nota.recibe { outline:2px dashed var(--accent);outline-offset:3px; }
  /* Los demás archivos de una nota, en chips */
  .adj-tarjeta { display:flex;flex-wrap:wrap;gap:5px;margin-top:8px; }
  .adj-tarjeta button { display:flex;align-items:center;gap:5px;max-width:100%;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.18);color:var(--text);font:inherit;font-size:11px;font-weight:650;padding:3px 9px 3px 7px;border-radius:999px;cursor:pointer; }
  .adj-tarjeta button:hover { background:rgba(255,255,255,.08); }
  .adj-tarjeta svg { width:11px;height:11px;flex-shrink:0;color:#38bdf8; }
  .adj-tarjeta span { overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px; }
  /* Ventana de la nota: adjuntos y soltar archivos */
  .adjuntos { display:flex;flex-direction:column;gap:5px; }
  .adjuntos[hidden] { display:none; }
  .adj-tit { font-size:11px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin:2px 2px 1px; }
  .adj-fila { display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);animation:popIn .22s cubic-bezier(.2,.8,.2,1); }
  .adj-fila.se-ve { cursor:pointer; }
  .adj-fila.se-ve:hover { background:rgba(255,255,255,.08); }
  .adj-fila img { width:34px;height:34px;border-radius:8px;object-fit:cover;flex-shrink:0; }
  .adj-fila img.icono { object-fit:contain;background:transparent; }
  .adj-ext { width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;font-size:10px;font-weight:800;text-transform:uppercase;background:color-mix(in srgb, #38bdf8 22%, transparent);color:#7dd3fc; }
  .adj-nom { flex:1;min-width:0;font-size:12.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
  .adj-tam { font-size:11px;color:var(--text3);flex-shrink:0; }
  .adj-quitar { width:22px;height:22px;border-radius:50%;border:none;background:transparent;color:var(--text3);display:grid;place-items:center;cursor:pointer;flex-shrink:0; }
  .adj-quitar:hover { background:rgba(255,255,255,.1);color:var(--text); }
  .pop-nota.soltando { outline:2px dashed var(--accent);outline-offset:-8px; }
  .pop-nota.soltando::after { content:'Suelta para adjuntar';position:absolute;inset:0;display:grid;place-items:center;font-weight:750;font-size:15px;color:var(--text);
    background:color-mix(in srgb, var(--accent2) 18%, rgba(0,0,0,.45));border-radius:inherit;pointer-events:none;z-index:5; }
  .archivo-prev { position:relative;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.25);display:grid;place-items:center;min-height:70px;max-height:220px; }
  .archivo-prev img { width:100%;max-height:220px;object-fit:cover;display:block;border-radius:12px;pointer-events:none; }
  .archivo-prev img.icono { width:56px;height:56px;object-fit:contain;margin:16px auto; }
  .archivo-prev .ext { position:absolute;left:8px;top:8px;padding:2px 7px;border-radius:7px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px); }
  .archivo-pie { display:flex;align-items:center;gap:6px;margin-top:8px;padding:0 4px;font-size:12px;font-weight:650; }
  .archivo-pie .nom { flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
  .archivo-pie .tam { color:var(--text2);font-weight:600;font-size:11px;flex-shrink:0; }
  .nota.con-archivo .nota-texto { padding:6px 4px 0; }
  .mapa.soltando { border-color:var(--accent);box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--accent) 50%, transparent), inset 0 0 60px color-mix(in srgb, var(--accent2) 25%, transparent); }
  .mapa.soltando::after { content:'Suelta aquí para añadirlos a tus notas';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 18px;border-radius:999px;background:color-mix(in srgb, var(--bg2) 80%, transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:13px;font-weight:700;pointer-events:none; }
  .visor-fondo { position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:notaCae .3s both; }
  .visor { position:fixed;inset:24px;z-index:71;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:22px;
    background:radial-gradient(120% 60% at 30% 0%, rgba(255,255,255,.12), rgba(255,255,255,0) 60%), color-mix(in srgb, var(--bg2) 92%, transparent);
    border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 70px -20px rgba(0,0,0,.75);animation:selEntra .35s cubic-bezier(.34,1.56,.64,1) both; }
  .visor-cab { display:flex;align-items:center;gap:8px; }
  .visor-cab b { flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px; }
  .visor-cuerpo { flex:1;min-height:0;border-radius:14px;overflow:auto;background:rgba(0,0,0,.25);display:grid;place-items:center; }
  .visor-cuerpo img { max-width:100%;max-height:100%;object-fit:contain;border-radius:12px; }
  .visor-cuerpo iframe { width:100%;height:100%;border:none;border-radius:12px;background:#fff; }
  .visor-cuerpo pre { width:100%;height:100%;margin:0;padding:16px;white-space:pre-wrap;font:12.5px/1.5 ui-monospace, Consolas, monospace;color:var(--text);align-self:start; }
  .visor-cuerpo .sin { text-align:center;color:var(--text2);font-size:13px;display:flex;flex-direction:column;gap:12px;align-items:center; }
  .nota.elegida { outline:2px solid var(--accent);outline-offset:3px; }
  .marco { position:absolute;border:1.5px solid var(--accent);border-radius:8px;background:color-mix(in srgb, var(--accent2) 14%, transparent);pointer-events:none;z-index:6; }
  .mapa.panear, .mapa.panear .nota { cursor:grabbing !important; }
  .nota.cogida { cursor:grabbing;scale:1.04;box-shadow:inset 0 1px 1px rgba(255,255,255,.4), 0 26px 44px -16px rgba(0,0,0,.7);animation:none;z-index:4; }
  .nota.apagada { opacity:.22;filter:saturate(.4); }
  .nota.se-va { animation:notaSeVa .26s cubic-bezier(.4,0,.2,1) both !important;pointer-events:none; }
  .nota.hecha { opacity:.55; }
  .nota.hecha .nota-texto { text-decoration:line-through; }
  @keyframes notaCae { from { opacity:0; transform:translateY(6px) scale(.97); filter:blur(6px); } to { opacity:1; transform:none; filter:none; } }
  .nota.recien { animation:notaNace .5s cubic-bezier(.22,1,.36,1) both; }
  .nota.recien::before { content:'';position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;box-shadow:0 0 0 1.5px color-mix(in srgb, var(--accent) 70%, transparent), 0 0 22px -4px color-mix(in srgb, var(--accent) 55%, transparent);animation:brilloNace 1.4s .15s ease-out both; }
  @keyframes notaNace { from { opacity:0; transform:scale(.94); filter:blur(8px); } 60% { filter:blur(0); } to { opacity:1; transform:none; filter:none; } }
  @keyframes brilloNace { from { opacity:1; } to { opacity:0; } }
  /* Hecha (2.16): se comprime (se aplasta hacia su centro) y desaparece, con un toque verde. */
  .nota.se-hace { pointer-events:none;animation:hechaComprime .5s cubic-bezier(.55,0,.75,.2) both;box-shadow:0 0 0 2px #34d39999, 0 0 26px -6px #34d399aa; }
  @keyframes hechaComprime {
    0% { transform:none; opacity:1; }
    28% { transform:scale(1.04, .9); }
    100% { transform:scale(.55, 0); opacity:0; filter:blur(2px); }
  }
  /* Hecha: un sello verde con el check que se dibuja; luego la nota sube un poco y se desvanece */
  .nota.se-completa { animation:none !important;transition:none !important;pointer-events:none;will-change:transform, opacity, filter; }
  .hecha-sello { position:absolute;inset:0;border-radius:inherit;display:grid;place-items:center;pointer-events:none;z-index:3;
    background:color-mix(in srgb, #34d399 18%, rgba(10,20,16,.35));-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px); }
  .hecha-sello i { width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#34d399;box-shadow:0 6px 18px -4px rgba(52,211,153,.6), inset 0 1px 1px rgba(255,255,255,.5); }
  .hecha-sello svg { width:20px;height:20px; }
  .hecha-sello path { stroke-dasharray:24;stroke-dashoffset:24; }
  @keyframes notaSeVa { from { opacity:1; transform:none; filter:none; } to { opacity:0; transform:translateY(4px) scale(.95); filter:blur(5px); } }
  /* Urgencia alta: un halo que respira. */
  .nota.u-alta::after { content:'';position:absolute;inset:-3px;border-radius:21px;border:2px solid #f8717199;box-shadow:0 0 14px -2px #f8717166;pointer-events:none; }
  @keyframes halo { 0%,100% { opacity:.15; } 50% { opacity:.7; } }

  .nota-texto { font-size:13.5px;line-height:1.4;word-break:break-word; }
  /* Notas largas plegadas: altura máxima y el final que se desvanece */
  .nota-texto.plegada { max-height:210px;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom, #000 70%, transparent);mask-image:linear-gradient(to bottom, #000 70%, transparent); }
  .plegar { display:flex;align-items:center;gap:4px;margin:6px auto 0;padding:3px 10px 3px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.18);
    color:var(--text2);font:inherit;font-size:11px;font-weight:700;cursor:pointer;transition:background .15s, color .15s; }
  .plegar:hover { background:rgba(255,255,255,.08);color:var(--text); }
  .plegar svg { width:12px;height:12px;transition:transform .25s; }
  /* 2.16: Markdown en las notas. */
  .md-p { white-space:pre-wrap;min-height:1.2em; }
  .md-h1 { font-size:17px;font-weight:800;margin:2px 0 4px;letter-spacing:-.01em; }
  .md-h2 { font-size:15px;font-weight:750;margin:2px 0 3px; }
  .md-h3 { font-size:13.5px;font-weight:750;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);margin:2px 0; }
  .md-li { display:flex;gap:7px; }
  .md-li::before { content:'';width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7;margin-top:.55em;flex-shrink:0; }
  .md-ol { display:flex;gap:6px; }
  .md-ol b { font-weight:700;opacity:.7;min-width:14px; }
  .md-cita { border-left:3px solid color-mix(in srgb, var(--c) 70%, #fff);padding:1px 0 1px 9px;color:var(--text2);font-style:italic; }
  .md-hr { height:1px;background:color-mix(in srgb, var(--text) 22%, transparent);margin:7px 0; }
  .nota-texto code { font-family:ui-monospace, Consolas, monospace;font-size:12px;padding:1px 5px;border-radius:6px;background:rgba(0,0,0,.25); }
  .nota-texto a { color:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb, var(--c) 80%, #fff);text-underline-offset:2px;cursor:pointer; }
  .nota-texto mark { background:color-mix(in srgb, #fbbf24 45%, transparent);color:inherit;border-radius:4px;padding:0 2px; }
  /* Barra del editor (modo lápiz) y vista previa (modo ojo). */
  .md-barra { display:flex;gap:3px;flex-wrap:wrap;align-items:center; }
  .md-barra button {
    min-width:30px;height:28px;padding:0 7px;border-radius:9px;border:1px solid rgba(255,255,255,.12);color:var(--text);font:inherit;font-size:12.5px;cursor:pointer;
    background:radial-gradient(120% 90% at 30% 0%, rgba(255,255,255,.18), rgba(255,255,255,0) 60%), var(--bg2);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.25);display:grid;place-items:center;transition:transform .25s cubic-bezier(.34,1.56,.64,1), background .15s;
  }
  .md-barra button:hover { transform:translateY(-1px);background:var(--bg3); }
  .md-barra .sep { width:1px;height:18px;background:var(--border);margin:0 3px; }
  .modo-md { display:flex;background:var(--bg2);border-radius:999px;padding:2px; }
  .modo-md button { border:none;background:transparent;box-shadow:none;border-radius:999px;color:var(--text2);height:26px;min-width:32px;display:grid;place-items:center;cursor:pointer; }
  .modo-md button.activo { background:color-mix(in srgb, var(--accent2) 30%, transparent);color:var(--text); }
  /* Píldoras de propiedades (2.16): cada una enseña su valor y abre su selector. */
  .props { display:flex;gap:6px;flex-wrap:wrap; }
  .pildora {
    display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border);
    background:radial-gradient(120% 90% at 30% 0%, rgba(255,255,255,.12), rgba(255,255,255,0) 60%), var(--bg2);
    color:var(--text2);font:inherit;font-size:12px;font-weight:650;cursor:pointer;white-space:nowrap;
    transition:background .15s, color .15s, transform .3s cubic-bezier(.34,1.56,.64,1), border-color .15s;
  }

  .vivo {

  .md-vista { min-height:110px;max-height:260px;overflow:auto;padding:12px 14px;border-radius:14px;background:var(--bg2);--c:var(--accent2); }

  /* Nota nueva escribiéndose en su sitio del mapa. */

  .nota.borrador textarea {

    color:var(--text);font:inherit;font-size:13.5px;line-height:1.4;outline:none;box-shadow:none !important;
  }

  /* Popups */

  .pop-nota textarea { min-height:110px;resize:vertical; }
  /* La ventana de la nota es sobre todo un editor: grande, con el texto ocupando casi todo; la
     barra de formato y las propiedades, pequeñas y recogidas. */
  .pop-nota { width:min(780px, calc(100vw - 32px)); height:min(660px, calc(100vh - 32px)); max-height:none; overflow:hidden; padding:14px 16px 14px; gap:9px; }

  .fila { display:flex;gap:8px;align-items:center;flex-wrap:wrap; }

  .seg button i { width:7px;height:7px;border-radius:50%; }

  .colores { display:flex;gap:5px;flex-wrap:wrap; }

  .colores button:hover { transform:scale(1.15); }

  /* La fecha del recordatorio, con la letra de la app y el calendario en el tema de la app. */
  #pnRecordatorio, #pnVence { font:inherit;font-size:13px;font-weight:600;color-scheme:dark;padding:10px 14px;background:var(--bg2) !important;border:1px solid transparent !important;border-radius:14px;color:var(--text); }

  #pnRecordatorio::-webkit-calendar-picker-indicator { opacity:.6;cursor:pointer; }
  /* Selector «avísame dentro de…» (2.16): número con − / + y la unidad. */
  .dentro {
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;border-radius:16px;
    background:radial-gradient(120% 90% at 30% 0%, rgba(255,255,255,.14), rgba(255,255,255,0) 60%), color-mix(in srgb, var(--bg2) 70%, transparent);
    border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 1px rgba(255,255,255,.2);
    -webkit-backdrop-filter:url(#vidrio) blur(4px);backdrop-filter:url(#vidrio) blur(4px);
    animation:notaCae .4s cubic-bezier(.34,1.56,.64,1) both;
  }
  .dentro[hidden] { display:none; }
  .paso { display:flex;align-items:center;gap:2px;background:var(--bg2);border-radius:999px;padding:3px; }
  .paso button { width:28px;height:28px;border-radius:50%;border:none;background:transparent;color:var(--text);font:inherit;font-size:16px;cursor:pointer; }

  .dentro .que { font-size:11.5px;color:var(--text2);width:100%; }
  /* Las unidades ocupan todo el ancho y se reparten el sitio: nunca se salen del recuadro. */
  .dentro .seg { width:100%;min-width:0; }
  .dentro .seg button { flex:1 1 0;min-width:0;justify-content:center;padding:6px 4px;overflow:hidden;text-overflow:ellipsis; }
  /* El número: sin las flechas de Windows (ya están − y +) ni el recuadro del foco. */
  .paso input::-webkit-inner-spin-button, .paso input::-webkit-outer-spin-button { -webkit-appearance:none;appearance:none;margin:0; }
  .paso input { -moz-appearance:textfield;appearance:textfield; }
  .paso input:focus, .paso input:focus-visible { outline:none !important;box-shadow:none !important; }
  .paso:focus-within { box-shadow:0 0 0 1.5px color-mix(in srgb, var(--accent) 45%, transparent); }
  /* Campos propios (2.16): botón con el valor; al pulsarlo sale su selector de cristal. */
  .campo {
    display:flex;align-items:center;gap:8px;min-height:40px;padding:9px 14px;border-radius:14px;border:1px solid transparent;
    background:var(--bg2);color:var(--text);font:inherit;font-size:13px;font-weight:650;text-align:left;cursor:pointer;
    transition:background .15s, border-color .15s;
  }

  .campo i { width:9px;height:9px;border-radius:50%;flex-shrink:0; }
  .campo svg { margin-left:auto;opacity:.55;flex-shrink:0; }
  .selector {
    position:fixed;z-index:80;width:286px;padding:12px;border-radius:20px;color:var(--text);
    background:radial-gradient(120% 70% at 30% 0%, rgba(255,255,255,.14), rgba(255,255,255,0) 60%), color-mix(in srgb, var(--panel, var(--bg2)) 88%, transparent);
    -webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
    border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 1px rgba(255,255,255,.25), 0 24px 50px -18px rgba(0,0,0,.7);
    animation:selEntra .32s cubic-bezier(.34,1.56,.64,1) both;transform-origin:top center;
  }
  @keyframes selEntra { from { opacity:0; transform:translateY(-6px) scale(.96); } to { opacity:1; transform:none; } }
  .sel-mes { display:flex;align-items:center;gap:6px;margin-bottom:8px; }

    transition:background .15s, transform .25s cubic-bezier(.34,1.56,.64,1);

    transition:background .15s, transform .25s cubic-bezier(.34,1.56,.64,1);

  .sel-lista i { width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--c, transparent);border:1.5px solid var(--c, var(--text3)); }

  /* Caja fuerte */

    background:radial-gradient(120% 80% at 30% 0%, rgba(255,255,255,.22), rgba(255,255,255,0) 60%), color-mix(in srgb, var(--accent2) 18%, transparent);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.18); box-shadow:inset 0 1px 1px rgba(255,255,255,.35), 0 14px 30px -14px rgba(0,0,0,.6);

  /* La pizarra de la caja: un borde del color de acento para saber dónde estás */

<script>
const { ipcRenderer } = require('electron');
let currentState = null;
let filtroSeccion = '';      // '' = todas (los filtros apagan, no esconden)
let busqueda = '';
let verHechas = false;
const ANCHO_NOTA = 230;
const COLORES_NOTA = ['#f87171', '#fb923c', '#fbbf24', '#a3e635', '#34d399', '#2dd4bf', '#38bdf8', '#60a5fa', '#818cf8', '#a78bfa', '#e879f9', '#f472b6'];
const URGENCIAS = { baja: 'Baja', media: 'Media', alta: 'Urgente' };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let enCaja = false;   // 2.16: en la pizarra de la caja fuerte
// Dentro de la caja, lo que se hace con las notas (y Ctrl+Z) va marcado para que main lo cifre.
const enviar = (type, payload) => {
  if (enCaja && /^(notas?-|undo$|redo$)/.test(type) && !/^nota-seccion/.test(type)) payload = { ...(payload || {}), caja: true };
  ipcRenderer.send('action', { type, payload });
};
function notasActuales() { if (!currentState) return []; return (enCaja ? currentState.cajaNotas : currentState.notas) || []; }

const mapa = document.getElementById('mapa');
const lienzo = document.getElementById('lienzo');

// ── Vista del mapa (desplazamiento y zoom), recordada en este equipo ──────────
let vista = { x: 40, y: 30, z: 1 };
try { const v = JSON.parse(localStorage.getItem('notas.vista') || 'null'); if (v && Number.isFinite(v.x) && Number.isFinite(v.y) && Number.isFinite(v.z)) vista = v; } catch {}
let primeraVez = !(() => { try { return localStorage.getItem('notas.vista'); } catch { return null; } })();
let quietoT = null;
function moviendose(ms) {
  mapa.classList.add('moviendose');
  clearTimeout(quietoT);
  quietoT = setTimeout(() => mapa.classList.remove('moviendose'), ms || 180);
}
function aplicarVista() {
  moviendose();
  lienzo.style.transform = `translate(${vista.x}px, ${vista.y}px) scale(${vista.z})`;
  mapa.style.backgroundPosition = `${vista.x}px ${vista.y}px`;
  mapa.style.backgroundSize = `${24 * vista.z}px ${24 * vista.z}px`;
  clearTimeout(aplicarVista.t);
  aplicarVista.t = setTimeout(() => { try { localStorage.setItem('notas.vista', JSON.stringify(vista)); } catch {} }, 400);
}
function zoomEn(d, cx, cy) {
  const r = mapa.getBoundingClientRect();
  const px = cx == null ? r.width / 2 : cx - r.left, py = cy == null ? r.height / 2 : cy - r.top;
  const z = Math.max(0.4, Math.min(1.6, vista.z + d));
  vista.x = px - (px - vista.x) * (z / vista.z);
  vista.y = py - (py - vista.y) * (z / vista.z);
  vista.z = z;
  lienzo.style.transition = cx == null ? 'transform .35s cubic-bezier(.22,1,.36,1)' : '';
  aplicarVista();
}
// Que se vean todas: encuadra la caja que las contiene.
function encuadrar(animado) {
  const ns = notasVisibles();
  if (!ns.length) { vista = { x: 40, y: 30, z: 1 }; aplicarVista(); return; }
  const xs = ns.map(n => n.x), ys = ns.map(n => n.y);
  const minX = Math.min(...xs), minY = Math.min(...ys), maxX = Math.max(...xs) + ANCHO_NOTA, maxY = Math.max(...ys) + 140;
  const r = mapa.getBoundingClientRect();

function pintarMarkdown(cont, texto, idNota) {

  const lineas = String(texto || '').split('\n');
  lineas.forEach((linea, i) => {
    const casilla = linea.match(/^\s*(?:-\s*)?\[( |x|X)\]\s?(.*)$/);
    let el;
    if (casilla) {
      const hecho = casilla[1] !== ' ';
      el = document.createElement('div');
      el.className = 'casilla' + (hecho ? ' marcada' : '');
      el.setAttribute('role', 'checkbox'); el.setAttribute('aria-checked', String(hecho)); el.tabIndex = 0;
      el.innerHTML = `<span class="marca">${ICO.check}</span><span class="t">${mdLinea(casilla[2])}</span>`;
      if (idNota) {
        const alternar = (e) => {
          e.stopPropagation();
          el.classList.toggle('marcada');
          const ls = lineas.slice();
          ls[i] = linea.replace(/\[( |x|X)\]/, el.classList.contains('marcada') ? '[x]' : '[ ]');
          setTimeout(() => enviar('nota-editar', { id: idNota, texto: ls.join('\n') }), 320);   // que se vea el check dibujarse
        };
        // Solo el circulito marca: el texto de la casilla sirve para coger y mover la nota.
        el.addEventListener('pointerdown', (e) => { if (e.target.closest('.marca')) e.stopPropagation(); });
        el.onclick = (e) => { if (e.target.closest('.marca')) alternar(e); };
        el.onkeydown = (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); alternar(e); } };
      }
    } else {
      let m;
      el = document.createElement('div');
      if ((m = linea.match(/^(#{1,3})\s+(.*)$/))) { el.className = 'md-h' + m[1].length; el.innerHTML = mdLinea(m[2]); }
      else if ((m = linea.match(/^\s*[-*•]\s+(.*)$/))) { el.className = 'md-li'; el.innerHTML = `<span>${mdLinea(m[1])}</span>`; }
      else if ((m = linea.match(/^\s*(\d+)[.)]\s+(.*)$/))) { el.className = 'md-ol'; el.innerHTML = `<b>${m[1]}.</b><span>${mdLinea(m[2])}</span>`; }
      else if ((m = linea.match(/^>\s?(.*)$/))) { el.className = 'md-cita'; el.innerHTML = mdLinea(m[1]); }
      else if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(linea)) { el.className = 'md-hr'; }
      else { el.className = 'md-p'; el.innerHTML = mdLinea(linea); }
    }
    cont.appendChild(el);
  });
  // Enlaces: se abren en el navegador (solo http/https).
  cont.querySelectorAll('a[data-url]').forEach(a => {
    a.addEventListener('pointerdown', (e) => e.stopPropagation());
    a.onclick = (e) => { e.stopPropagation(); try { require('electron').shell.openExternal(a.dataset.url); } catch {} };
  });
}

// Rueda: el tono va por el ángulo, la intensidad por la distancia al centro y la luz con la barra.

function ruedaColor(el, inicial, usar, volver) {

  // Si ya había un color, la rueda empieza en él.
  if (/^#[0-9a-f]{6}$/i.test(inicial || '')) {
    const [rr, gg, bb] = [1, 3, 5].map(i => parseInt(inicial.slice(i, i + 2), 16) / 255), mx = Math.max(rr, gg, bb), mn = Math.min(rr, gg, bb), d = mx - mn;

  }

    <div class="barra-luz"><div class="tirador"></div></div>
    <div class="rueda-pie"><span class="muestra"></span><code></code><div style="flex:1"></div><button type="button" class="btn-ghost" data-volver>Volver</button><button type="button" class="btn-primary" data-usar>Usar</button></div>`;
  const rueda = el.querySelector('.rueda'), barra = el.querySelector('.barra-luz');
  const pintar = () => {
    const c = hsvAHex(h, sat, v);
    rueda.querySelector('.oscuro').style.opacity = String(1 - v);
    const ang = h * Math.PI / 180, rad = sat * 100;
    const t = rueda.querySelector('.tirador'); t.style.left = (100 + Math.cos(ang) * rad) + 'px'; t.style.top = (100 + Math.sin(ang) * rad) + 'px'; t.style.background = c;
    barra.style.background = `linear-gradient(90deg, #000, ${hsvAHex(h, sat, 1)})`;
    const tb = barra.querySelector('.tirador'); tb.style.left = (v * 100) + '%'; tb.style.background = c;
    el.querySelector('.muestra').style.background = c; el.querySelector('code').textContent = c;
  };
  const arrastrar = (zona, mover) => zona.addEventListener('pointerdown', (e) => {
    zona.setPointerCapture(e.pointerId); mover(e);
    const m = (ev) => mover(ev), fin = () => { zona.removeEventListener('pointermove', m); zona.removeEventListener('pointerup', fin); };

  });
  arrastrar(rueda, (e) => {
    const r = rueda.getBoundingClientRect(), x = e.clientX - r.left - 100, y = e.clientY - r.top - 100;

  el.querySelector('[data-usar]').onclick = () => usar(hsvAHex(h, sat, v));
  pintar();
}

    <button type="button" class="btn-primary" style="margin-left:auto">${textoBoton || 'Poner'}</button>`;
  const inp = cont.querySelector('input'), que = cont.querySelector('.que');
  const pintar = () => {
    cont.querySelectorAll('[data-u]').forEach(b => b.classList.toggle('activo', b.dataset.u === u));
    inp.value = n;
    que.textContent = 'Avisará ' + textoRecordatorio(dentroDe(n, u)).toLowerCase();
  };
  cont.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { n = Math.max(1, Math.min(999, n + (b.dataset.p === '+' ? 1 : -1))); pintar(); });
  inp.oninput = () => { n = Math.max(1, Math.min(999, parseInt(inp.value, 10) || 1)); que.textContent = 'Avisará ' + textoRecordatorio(dentroDe(n, u)).toLowerCase(); };
  inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); poner(dentroDe(n, u)); } };
  cont.querySelectorAll('[data-u]').forEach(b => b.onclick = () => { u = b.dataset.u; pintar(); });
  cont.querySelector('.btn-primary').onclick = () => poner(dentroDe(n, u));
  pintar();
  setTimeout(() => { inp.focus(); inp.select(); }, 0);
}
document.querySelectorAll('#pnRapidos button').forEach(b => b.onclick = () => {
  const i = document.getElementById('pnRecordatorio');
  const dentro = document.getElementById('pnDentro');
  if (b.dataset.r === 'quitar') { i.value = ''; dentro.hidden = true; return; }
  if (b.dataset.r === 'otro') {
    dentro.hidden = !dentro.hidden;
    if (!dentro.hidden) selectorDentro(dentro, (ms) => { i.value = aLocal(ms); dentro.hidden = true; });
    return;
  }
  const [n, u] = RAPIDOS[b.dataset.r];
  i.value = aLocal(dentroDe(n, u));
  dentro.hidden = true;
});
// Desde el menú redondo, «Otro…» sale en su propia ventanita de cristal.
function abrirDentro(idNota) {
  const fondo = document.getElementById('popDentroFondo'), pop = document.getElementById('popDentro');
  fondo.style.display = 'block'; pop.style.display = 'flex';
  selectorDentro(document.getElementById('popDentroCuerpo'), (ms) => { enviar('nota-editar', { id: idNota, recordatorio: ms }); cerrarDentro(); }, 'Avisarme');
}
function cerrarDentro() { document.getElementById('popDentroFondo').style.display = 'none'; document.getElementById('popDentro').style.display = 'none'; }
function cerrarPopNota() { cerrarSelector(); popId = null; borrador = null; document.getElementById('popNotaFondo').style.display = 'none'; document.getElementById('popNota').style.display = 'none'; }
function guardarPopNota() {
  const texto = document.getElementById('pnTexto').value.replace(/\n\[ \]\s*$/, '').trim();
  const r = document.getElementById('pnRecordatorio').value;
  const v = document.getElementById('pnVence').value;
  if (borrador) {   // nueva: se crea en su sitio (vacía, no se crea nada)
    const b = borrador;
    if ((texto && texto !== '[ ]') || popArchivos.length) enviar('nota-crear', { texto: texto === '[ ]' ? '' : texto, archivo: popArchivos[0] || undefined, adjuntos: popArchivos.slice(1), x: b.x, y: b.y, urgencia: popUrgencia, seccion: document.getElementById('pnSeccion').value || null, color: popColor, recordatorio: r ? new Date(r).getTime() : null, vence: v ? new Date(v + 'T00:00').getTime() : null });
    cerrarPopNota(); return;
  }
  if (!texto && !popArchivos.length) { borrarDesdePop(); return; }
  enviar('nota-editar', { id: popId, texto, archivo: popArchivos[0] || null, adjuntos: popArchivos.slice(1), urgencia: popUrgencia, seccion: document.getElementById('pnSeccion').value || null, color: popColor, recordatorio: r ? new Date(r).getTime() : null, vence: v ? new Date(v + 'T00:00').getTime() : null });
  cerrarPopNota();
}
function borrarDesdePop() {
  const id = popId; cerrarPopNota();
  const el = lienzo.querySelector(`.nota[data-id="${id}"]`);
  if (el) irse(el, () => enviar('nota-borrar', { id }), true); else enviar('nota-borrar', { id });
}

// ── Secciones ─────────────────────────────────────────────────────────────────
let secId = null, secColor = COLORES_NOTA[6];
function abrirPopSec(id) {
  const s = id ? seccionDe(id) : null;
  secId = s ? id : null; secColor = null;
  document.getElementById('popSecTitulo').textContent = s ? 'Sección' : 'Nueva sección';
  document.getElementById('psNombre').value = s ? s.name : '';
  document.getElementById('psBorrar').style.display = 'none';   // se borran desde Tareas
  document.getElementById('psColores').innerHTML = '<div style="font-size:12px;color:var(--text2);line-height:1.4">Es una sección de Tareas: su color sale de su paleta (en Tareas, el botón de colores de la sección).</div>';
  document.getElementById('popSecFondo').style.display = 'block';
  document.getElementById('popSec').style.display = 'flex';
  setTimeout(() => document.getElementById('psNombre').focus(), 0);
}
function pintarColoresSec() {
  const c = document.getElementById('psColores'); c.innerHTML = '';
  COLORES_NOTA.forEach(col => { const b = document.createElement('button'); b.style.background = col; if (secColor === col) b.className = 'sel'; b.onclick = () => { secColor = col; pintarColoresSec(); }; c.appendChild(b); });
}
function cerrarPopSec() { document.getElementById('popSecFondo').style.display = 'none'; document.getElementById('popSec').style.display = 'none'; }
function guardarSeccion() {
  const name = document.getElementById('psNombre').value.trim();
  if (!name) return;
  if (secId) enviar('rename-group', { groupId: secId, name });
  else enviar('create-group', { name });
  cerrarPopSec();
}
document.getElementById('psNombre').addEventListener('keydown', (e) => { if (e.key === 'Enter') guardarSeccion(); });
function borrarSeccion() {
  const s = seccionDe(secId); if (!s) return;
  confirmar('Borrar sección', `La sección «${s.name}» se borra; sus notas se quedan, sin sección. Ctrl+Z lo deshace.`, 'Borrar', () => {
    enviar('nota-seccion-borrar', { id: secId }); if (filtroSeccion === secId) filtroSeccion = ''; cerrarPopSec();
  });
}

// ── Confirmar ─────────────────────────────────────────────────────────────────
function confirmar(titulo, texto, ok, fn) {
  document.getElementById('confTitulo').textContent = titulo;
  document.getElementById('confTexto').textContent = texto;
  const b = document.getElementById('confOk'); b.textContent = ok;
  b.onclick = () => { cerrarConf(); fn(); };
  document.getElementById('popConfFondo').style.display = 'block';
  document.getElementById('popConf').style.display = 'flex';
}
function cerrarConf() { document.getElementById('popConfFondo').style.display = 'none'; document.getElementById('popConf').style.display = 'none'; }

// Ctrl+Z / Ctrl+Y fuera de los campos de texto: deshacer y rehacer, como en el calendario.
document.addEventListener('keydown', (e) => {
  const enCampo = e.target.closest && e.target.closest('input, textarea, select');
  if (e.key === 'Escape' && !selectorAbierto && seleccion.size && document.getElementById('popNota').style.display !== 'flex') { seleccion.clear(); marcarSeleccion(); return; }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && document.getElementById('popNota').style.display === 'flex' && !selectorAbierto) { e.preventDefault(); guardarPopNota(); return; }   // Ctrl+Enter guarda la nota
  if (e.key === 'Escape' && document.getElementById('visor')) { cerrarVisor(); return; }
  if (e.key === 'Escape') { if (selectorAbierto) { cerrarSelector(); return; } cerrarPopNota(); cerrarPopSec(); cerrarConf(); cerrarDentro(); return; }
  if (enCampo || e.target.isContentEditable) return;
  if (atajosNotas(e)) return;
  if (!(e.ctrlKey || e.metaKey)) return;
  if (e.key.toLowerCase() === 'z') { e.preventDefault(); enviar(e.shiftKey ? 'redo' : 'undo'); }
  if (e.key.toLowerCase() === 'y') { e.preventDefault(); enviar('redo'); }
});

// ── Atajos de las notas ───────────────────────────────────────────────────────
// Ctrl+C / X / V / D / A, Supr, Enter, Esc y flechas, como en cualquier pizarra.
let portapapelesNotas = null;   // { texto, notas } lo último copiado aquí (con sus propiedades)
const sinId = (n) => ({ archivo: n.archivo || undefined, texto: n.texto, urgencia: n.urgencia || '', seccion: n.seccion || null, color: n.color || null, recordatorio: n.recordatorio || null, vence: n.vence || null, fijada: !!n.fijada, x: n.x, y: n.y });
function copiarElegidas() {
  const ns = elegidas(); if (!ns.length) return false;
  const texto = ns.map(n => n.texto).join('\n\n');
  portapapelesNotas = { texto, notas: ns.map(sinId) };
  try { require('electron').clipboard.writeText(texto); } catch {}
  return true;
}
function pegar() {
  let texto = ''; try { texto = require('electron').clipboard.readText().replace(/\r/g, ''); } catch {}
  const r = mapa.getBoundingClientRect();
  const sitio = ratonMapa || aMapa(r.left + r.width / 2, r.top + r.height / 2);
  if (portapapelesNotas && texto === portapapelesNotas.texto && portapapelesNotas.notas.length) {
    // Lo copiado aquí: mismas propiedades, colocadas donde está el ratón y en el mismo orden.
    const ns = portapapelesNotas.notas, x0 = Math.min(...ns.map(n => n.x)), y0 = Math.min(...ns.map(n => n.y));
    enviar('notas-pegar', { lista: ns.map(n => ({ ...n, x: sitio.x + n.x - x0, y: sitio.y + n.y - y0 })) });
  } else if (texto.trim()) {
    enviar('nota-crear', { texto: texto.trim().slice(0, 4000), seccion: filtroSeccion || null, x: sitio.x - 20, y: sitio.y - 16 });
  }
}
function atajosNotas(e) {
  if (document.getElementById('popNota').style.display === 'flex' || borrador) return false;
  const k = e.key.toLowerCase(), ctrl = e.ctrlKey || e.metaKey;
  const ns = elegidas();
  if (ctrl && k === 'c') { if (copiarElegidas()) { e.preventDefault(); return true; } return false; }
  if (ctrl && k === 'x') { if (copiarElegidas()) { e.preventDefault(); enviar('notas-borrar', { ids: ns.map(n => n.id) }); seleccion.clear(); return true; } return false; }
  if (ctrl && k === 'v') { e.preventDefault(); pegar(); return true; }
  if (ctrl && k === 'd') { if (!ns.length) return false; e.preventDefault(); enviar('notas-pegar', { lista: ns.map(n => ({ ...sinId(n), x: n.x + 28, y: n.y + 28 })) }); return true; }
  if (!ctrl && !e.altKey && k === 'n') { e.preventDefault(); notaEnCentro(); return true; }
  if (ctrl && k === 'a') { e.preventDefault(); seleccion = new Set(notasVisibles().map(n => n.id)); marcarSeleccion(); return true; }
  if (!ctrl && (e.key === 'Delete' || e.key === 'Backspace') && ns.length) {
    e.preventDefault();
    const ids = ns.map(n => n.id); seleccion.clear();
    ids.forEach(id => { const el = lienzo.querySelector(`.nota[data-id="${id}"]`); if (el) el.classList.add('se-va'); });
    setTimeout(() => enviar('notas-borrar', { ids }), 240);
    return true;
  }
  if (!ctrl && e.key === 'Enter' && ns.length === 1) { e.preventDefault(); abrirPopNota(ns[0].id); return true; }
  if (e.key === 'Escape' && seleccion.size) { seleccion.clear(); marcarSeleccion(); return true; }
  if (!ctrl && e.key.startsWith('Arrow') && ns.length && modo === 'libre') {
    e.preventDefault();
    const p = e.shiftKey ? 40 : 8, dx = k === 'arrowleft' ? -p : k === 'arrowright' ? p : 0, dy = k === 'arrowup' ? -p : k === 'arrowdown' ? p : 0;
    enviar('notas-mover', { lista: ns.map(n => ({ id: n.id, x: n.x + dx, y: n.y + dy })) });
    return true;
  }
  return false;
}

// ── Caja fuerte ───────────────────────────────────────────────────────────────
// Lo de dentro solo pasa por aquí mientras está abierta: al cerrarse (a mano, a los 5 minutos,
// al bloquear Windows) se borra de la página.
let cajaTipoNuevo = 'pin';
const caja = (accion, extra) => ipcRenderer.invoke('caja', { accion, ...(extra || {}) });
function pintarBotonCaja() {
  const b = document.getElementById('btnCaja');
  b.classList.toggle('activo', enCaja);
  b.querySelector('span').textContent = enCaja ? 'Cerrar caja' : 'Caja fuerte';
}
// Salir de la caja fuerte la cierra siempre (no se queda abierta a tus espaldas).
// Abierta, la caja es la misma pizarra (mapa, formas de ordenar, menú redondo…) con sus notas.
async function alternarCaja() {
  if (enCaja) caja('cerrar');
  enCaja = !enCaja;
  document.getElementById('titulo').textContent = enCaja ? 'Caja fuerte' : 'Notas';
  pintarBotonCaja();
  mostrarVista();
}
// Desde el aviso de un recordatorio: «Abrir» enseña esa nota (en el mapa normal).
ipcRenderer.on('abrir-nota', (_, id) => { if (enCaja) alternarCaja(); setTimeout(() => abrirPopNota(id), 150); });
ipcRenderer.on('caja-cerrada', () => { if (currentState) currentState.cajaNotas = null; if (enCaja) mostrarVista(); });
let vistaActual = 'mapa';
function mostrarVista() {
  const abierta = enCaja && !!currentState && Array.isArray(currentState.cajaNotas);
  const v = !enCaja ? 'mapa' : abierta ? 'caja-mapa' : 'caja-cerrada';
  document.body.classList.toggle('en-caja', v === 'caja-mapa');
  if (v === vistaActual) return;
  vistaActual = v;
  cerrarPopNota(); cerrarVisor(); RadialMenu.close && RadialMenu.close();
  document.getElementById('vistaMapa').style.display = v === 'caja-cerrada' ? 'none' : 'flex';
  document.getElementById('vistaCaja').hidden = v !== 'caja-cerrada';
  if (v === 'caja-cerrada') { caja('estado').then(pintarCaja); return; }
  seleccion.clear(); filtroSeccion = ''; busqueda = '';
  pintar(true);
  setTimeout(() => encuadrar(false), 40);
}
// Mientras se usa, no se cierra sola (cada acción también la mantiene abierta).
let ultimoToqueCaja = 0;
['pointerdown', 'keydown', 'wheel'].forEach(t => document.addEventListener(t, () => {
  if (vistaActual !== 'caja-mapa' || Date.now() - ultimoToqueCaja < 20000) return;
  ultimoToqueCaja = Date.now(); caja('tocar');
}, { passive: true, capture: true }));

// Las del menú: la nota, o todas las elegidas si es una de ellas.
function idsDelMenu(n) { return seleccion.has(n.id) && seleccion.size > 1 ? [...seleccion] : [n.id]; }
function salenVolando(ids) { ids.forEach(id => { const el = lienzo.querySelector(`.nota[data-id="${id}"]`); if (el) el.classList.add('se-va'); }); }
function resultadoCaja(r, verbo) {
  if (!r || r.error) { if (r && r.error) avisar(r.error); return false; }
  seleccion.clear();
  const n = r.movidas;
  avisar((n === 1 ? '1 nota ' : n + ' notas ') + verbo + (r.conArchivo ? ` (${r.conArchivo} con archivo se queda${r.conArchivo > 1 ? 'n' : ''} fuera)` : ''));
  return true;
}
async function aLaCaja(ids) {
  const est = await caja('estado');
  if (!est.existe) {
    confirmar('Primero, tu caja fuerte', 'Todavía no tienes caja fuerte. Créala con un PIN o una contraseña y luego manda ahí lo que quieras.', 'Crear caja fuerte', () => { if (!enCaja) alternarCaja(); });
    document.getElementById('confOk').className = 'btn-primary';
    return;
  }
  if (est.abierta) { const r = await caja('meter', { ids }); if (resultadoCaja(r, 'a la caja fuerte')) salenVolando(ids); return; }
  // Cerrada: con el PIN se guarda cifrada y la caja sigue cerrada.
  pedirSecreto(est.tipo, async (secreto) => {
    const r = await caja('meter', { ids, secreto });
    if (r && r.error && /incorrect|intentos/.test(r.error)) return r.error;
    resultadoCaja(r, 'a la caja fuerte');
    return null;
  });
}
async function sacarDeCaja(ids) { resultadoCaja(await caja('sacar', { ids }), 'de vuelta al mapa'); }

// Pedir el PIN o la contraseña en una ventanita (sin abrir la caja).
function pedirSecreto(tipo, intentar) {
  const fondo = document.createElement('div'); fondo.className = 'popup-backdrop'; fondo.style.cssText = 'display:block;z-index:70';
  const p = document.createElement('div'); p.className = 'entry-popup pide-secreto'; p.style.cssText = 'display:flex;width:300px;z-index:71';
  p.innerHTML = `<div class="candado" style="width:56px;height:56px;border-radius:20px;align-self:center">${CANDADO}</div>
    <div class="entry-popup-title" style="text-align:center">A la caja fuerte</div>
    <div style="font-size:12.5px;color:var(--text2);line-height:1.45;text-align:center">Escribe tu ${tipo === 'clave' ? 'contraseña' : 'PIN'} para guardarla cifrada. La caja sigue cerrada.</div>
    <input type="password" placeholder="${tipo === 'clave' ? 'Contraseña' : 'PIN'}" ${tipo === 'pin' ? 'inputmode="numeric" maxlength="8"' : 'maxlength="128"'} autocomplete="off" style="text-align:center;font-size:16px;letter-spacing:${tipo === 'pin' ? '.2em' : '.05em'}">
    <div class="caja-error" style="text-align:center"></div>
    <div class="entry-popup-actions"><div style="flex:1"></div><button class="btn-ghost" data-a="no">Cancelar</button><button class="btn-primary" data-a="si">Guardar</button></div>`;
  document.body.append(fondo, p);
  const i = p.querySelector('input'), err = p.querySelector('.caja-error'), cand = p.querySelector('.candado');
  const cerrar = () => { fondo.remove(); p.remove(); };
  const ok = async () => {
    if (!i.value) return;
    const b = p.querySelector('[data-a="si"]'); b.disabled = true;
    const e = await intentar(i.value);
    b.disabled = false;
    if (e) { err.textContent = e; cand.classList.remove('temblor'); void cand.offsetWidth; cand.classList.add('temblor'); i.value = ''; i.focus(); return; }
    cerrar();
  };
  fondo.onclick = cerrar;
  p.querySelector('[data-a="no"]').onclick = cerrar;
  p.querySelector('[data-a="si"]').onclick = ok;
  i.addEventListener('keydown', (e) => { if (e.key === 'Enter') ok(); if (e.key === 'Escape') { e.stopPropagation(); cerrar(); } });
  setTimeout(() => i.focus(), 0);
}
// Un aviso corto abajo, que se va solo.
function avisar(texto) {
  document.querySelectorAll('.aviso-flotante').forEach(x => x.remove());
  const a = document.createElement('div'); a.className = 'aviso-flotante'; a.textContent = texto;
  document.body.appendChild(a);
  setTimeout(() => a.classList.add('fuera'), 2600);
  setTimeout(() => a.remove(), 3000);
}

const CANDADO = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><circle cx="12" cy="16" r="1.3" fill="currentColor"/></svg>';
function pintarCaja(est) {
  const v = document.getElementById('vistaCaja');
  if (!est || !est.existe) {
    v.innerHTML = `<div class="caja-cerrada">
      <div class="candado">${CANDADO}</div>
      <h3>Crea tu caja fuerte</h3>
      <p>Notas que nadie ve sin tu PIN o tu contraseña. Se guardan cifradas: si lo olvidas, no hay forma de recuperarlas.</p>
      <div class="seg" id="cjTipo"><button type="button" data-t="pin">PIN</button><button type="button" data-t="clave">Contraseña</button></div>
      <input type="password" id="cj1" autocomplete="new-password">
      <input type="password" id="cj2" autocomplete="new-password">
      <div class="caja-error" id="cjError"></div>
      <button class="btn-primary" id="cjCrear">Crear caja fuerte</button>
    </div>`;
    const ponerTipo = (t) => {
      cajaTipoNuevo = t;
      v.querySelectorAll('#cjTipo button').forEach(b => b.classList.toggle('activo', b.dataset.t === t));
      ['cj1', 'cj2'].forEach((id, i) => { const el = document.getElementById(id); el.inputMode = t === 'pin' ? 'numeric' : 'text'; el.maxLength = t === 'pin' ? 8 : 128; el.classList.toggle('clave', t === 'clave'); el.placeholder = (t === 'pin' ? 'PIN de 4 a 8 números' : 'Contraseña (mín. 6)') + (i ? ' · otra vez' : ''); });
    };
    v.querySelectorAll('#cjTipo button').forEach(b => b.onclick = () => ponerTipo(b.dataset.t));
    ponerTipo(cajaTipoNuevo);
    const crear = async () => {
      const a = document.getElementById('cj1').value, b = document.getElementById('cj2').value;
      const err = document.getElementById('cjError');
      if (a !== b) { err.textContent = 'No coinciden'; return; }
      const r = await caja('crear', { secreto: a, tipo: cajaTipoNuevo });
      if (r.error) { err.textContent = r.error; return; }
      mostrarVista();
    };
    document.getElementById('cjCrear').onclick = crear;
    document.getElementById('cj2').addEventListener('keydown', (e) => { if (e.key === 'Enter') crear(); });
    setTimeout(() => document.getElementById('cj1').focus(), 0);
    return;
  }
  if (!est.abierta || !(currentState && Array.isArray(currentState.cajaNotas))) {
    v.innerHTML = `<div class="caja-cerrada">
      <div class="candado" id="cjCandado">${CANDADO}</div>
      <h3>Caja fuerte cerrada</h3>
      <input type="password" id="cjSecreto" placeholder="${est.tipo === 'clave' ? 'Contraseña' : 'PIN'}" ${est.tipo === 'pin' ? 'inputmode="numeric" maxlength="8"' : 'class="clave" maxlength="128"'} autocomplete="off">
      <div class="caja-error" id="cjError"></div>
      <button class="btn-primary" id="cjAbrir">Abrir</button>
      <button class="enlace" id="cjOlvido">¿Lo has olvidado?</button>
    </div>`;
    const abrir = async () => {
      const i = document.getElementById('cjSecreto');
      const r = await caja('abrir', { secreto: i.value });
      if (r.error) {
        document.getElementById('cjError').textContent = r.error;
        const c = document.getElementById('cjCandado'); c.classList.remove('temblor'); void c.offsetWidth; c.classList.add('temblor');
        i.value = ''; i.focus(); return;
      }
      mostrarVista();
    };
    document.getElementById('cjAbrir').onclick = abrir;
    document.getElementById('cjSecreto').addEventListener('keydown', (e) => { if (e.key === 'Enter') abrir(); });
    document.getElementById('cjOlvido').onclick = () => confirmar('Borrar la caja fuerte',
      'Sin el PIN o la contraseña no se puede abrir: nadie puede recuperarlo. Si la borras pierdes todas sus notas y puedes crear otra.', 'Borrar todo',
      async () => { pintarCaja(await caja('borrar')); });
    setTimeout(() => document.getElementById('cjSecreto').focus(), 0);
    return;
  }
  mostrarVista();   // abierta: la pizarra
}
</script>
