<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  /* 2.16: Notas. Notas sueltas en un mapa flotante: cada una donde la dejes, con sus propiedades
     (urgencia, recordatorio, sección, color). Y una caja fuerte cifrada aparte. */
  html, body { width:100%;height:100%; }
  body { border-radius:var(--radius);overflow:hidden; }
  .app { width:100%;height:100%;padding:24px;display:flex;flex-direction:column;gap:12px;position:relative;min-height:0;-webkit-app-region:no-drag; }
  .app-title { font-size:16px;font-weight:700;-webkit-app-region:drag;display:flex;align-items:center;gap:8px;flex-shrink:0; }
  .cabecera { display:flex;align-items:center;gap:8px;flex-shrink:0; }
  body:not(.embedded) .cabecera { padding-right:34px; }   /* la X de cerrar la ventana */
  .cabecera .app-title { flex:1; }
  .btn-pildora {
    display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--border);
    background:var(--bg2);color:var(--text2);font:inherit;font-size:12px;font-weight:650;cursor:pointer;-webkit-app-region:no-drag;white-space:nowrap;
    transition:background .15s, color .15s, transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .btn-pildora:hover { color:var(--text);background:var(--bg3);transform:translateY(-1px); }
  .btn-pildora.activo { color:var(--accent);border-color:color-mix(in srgb, var(--accent) 40%, transparent); }

  .apuntar { display:flex;gap:8px;align-items:center;flex-shrink:0; }
  .apuntar input { flex:1; }

  /* Filtros: no esconden nada, apagan lo que no encaja (todo sigue a la vista). */
  .filtros { display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex-shrink:0; }
  .chip-sec {
    display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--border);
    background:transparent;color:var(--text2);font:inherit;font-size:12px;font-weight:600;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .chip-sec i { width:8px;height:8px;border-radius:50%;background:var(--c, var(--text3)); }
  .chip-sec:hover { color:var(--text);background:var(--bg2); }
  .chip-sec.activo { color:var(--text);background:color-mix(in srgb, var(--c, var(--accent2)) 22%, transparent);border-color:color-mix(in srgb, var(--c, var(--accent2)) 45%, transparent); }
  .chip-sec.mas { border-style:dashed; }
  .filtros input.buscar { margin-left:auto;flex:0 1 150px;width:150px !important;min-width:90px;padding:6px 10px !important;font-size:12px !important; }

  /* El mapa: se arrastra el fondo para moverse, la rueda también; Ctrl + rueda acerca y aleja. */
  .mapa {
    flex:1;min-height:0;position:relative;overflow:hidden;border-radius:20px;cursor:grab;touch-action:none;
    border:1px solid var(--border);
    background-color:color-mix(in srgb, var(--bg2) 45%, transparent);
    background-image:radial-gradient(circle, color-mix(in srgb, var(--text) 14%, transparent) 1px, transparent 1.4px);
    background-size:24px 24px;
  }
  .mapa.moviendo { cursor:grabbing; }
  .lienzo { position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform; }
  .mapa-vacio[hidden] { display:none; }
  .mapa-vacio { position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--text3);font-size:13px;pointer-events:none;padding:20px; }
  .mapa-herr { position:absolute;right:10px;bottom:10px;display:flex;gap:4px;z-index:5; }
  .mapa-herr button, .modos button {
    width:32px;height:32px;border-radius:12px;border:1px solid rgba(255,255,255,.16);color:var(--text);cursor:pointer;display:grid;place-items:center;
    background:radial-gradient(120% 90% at 30% 0%, rgba(255,255,255,.22), rgba(255,255,255,0) 60%), color-mix(in srgb, var(--bg2) 45%, transparent);
    -webkit-backdrop-filter:url(#vidrio-boton) blur(2px) saturate(1.7);backdrop-filter:url(#vidrio-boton) blur(2px) saturate(1.7);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.4), 0 6px 14px -8px rgba(0,0,0,.55);
    transition:transform .3s cubic-bezier(.34,1.56,.64,1), color .15s, background .2s;
  }
  .mapa-herr button:hover, .modos button:hover { transform:scale(1.08); }
  /* Maneras de ordenar (arriba a la izquierda del mapa). */
  .modos { position:absolute;left:10px;top:10px;display:flex;gap:4px;z-index:5; }
  .modos button { color:var(--text2); }
  .modos button.activo { color:var(--accent);background:radial-gradient(120% 90% at 30% 0%, rgba(255,255,255,.3), rgba(255,255,255,0) 60%), color-mix(in srgb, var(--accent2) 30%, transparent); }
  /* Transición entre maneras: las notas se deslizan a su sitio nuevo, una tras otra. */
  .lienzo.animando .nota { transition:left .65s cubic-bezier(.34,1.25,.64,1), top .65s cubic-bezier(.34,1.25,.64,1), width .5s cubic-bezier(.22,1,.36,1), height .5s cubic-bezier(.22,1,.36,1), opacity .3s, filter .3s; }
  .lienzo.ordenado .nota { cursor:default; }
  .lienzo.m-cuadricula .nota { height:168px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 78%, transparent);mask-image:linear-gradient(#000 78%, transparent); }
  .lienzo.m-cuadricula .nota:hover { -webkit-mask-image:none;mask-image:none;overflow:auto; }
  .grupo-cab { position:absolute;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);white-space:nowrap;animation:notaCae .5s cubic-bezier(.34,1.56,.64,1) both;pointer-events:none; }
  .grupo-cab i { width:8px;height:8px;border-radius:50%;background:var(--c, var(--text3)); }
  .grupo-cab span { color:var(--text3);font-weight:600; }
  .mapa-herr button:hover { background:var(--bg3); }

  /* Nota de cristal */
  .nota {
    position:absolute;width:230px;border-radius:18px;padding:12px 13px 11px;cursor:grab;color:var(--text);user-select:none;
    background:
      radial-gradient(120% 80% at 20% 0%, rgba(255,255,255,.17), rgba(255,255,255,0) 60%),
      linear-gradient(160deg, color-mix(in srgb, var(--c) 34%, transparent), color-mix(in srgb, var(--c) 14%, transparent));
    -webkit-backdrop-filter:url(#vidrio) blur(5px) saturate(1.7); backdrop-filter:url(#vidrio) blur(5px) saturate(1.7);
    border:1px solid color-mix(in srgb, var(--c) 40%, rgba(255,255,255,.18));
    box-shadow:inset 0 1px 1px rgba(255,255,255,.35), 0 10px 22px -12px rgba(0,0,0,.6);
    transition:box-shadow .25s, opacity .3s, filter .3s, scale .35s cubic-bezier(.34,1.56,.64,1);
    animation:notaCae .55s cubic-bezier(.34,1.56,.64,1) both;
    --c:#8b93a7;
  }
  .nota:hover { box-shadow:inset 0 1px 1px rgba(255,255,255,.4), 0 16px 30px -14px rgba(0,0,0,.65); }
  .nota.cogida { cursor:grabbing;scale:1.04;box-shadow:inset 0 1px 1px rgba(255,255,255,.4), 0 26px 44px -16px rgba(0,0,0,.7);animation:none;z-index:4; }
  .nota.apagada { opacity:.22;filter:saturate(.4); }
  .nota.se-va { animation:notaSeVa .28s cubic-bezier(.4,0,1,1) both; }
  .nota.hecha { opacity:.55; }
  .nota.hecha .nota-texto { text-decoration:line-through; }
  @keyframes notaCae { from { opacity:0; transform:translateY(-12px) scale(.92); filter:blur(5px); } to { opacity:1; transform:none; filter:none; } }
  @keyframes notaSeVa { to { opacity:0; transform:scale(.88); filter:blur(6px); } }
  /* Urgencia alta: un halo que respira. */
  .nota.u-alta::after { content:'';position:absolute;inset:-3px;border-radius:21px;border:2px solid #f87171;opacity:.0;pointer-events:none;animation:halo 2.4s ease-in-out infinite; }
  @keyframes halo { 0%,100% { opacity:.15; } 50% { opacity:.7; } }

  .nota-texto { font-size:13.5px;line-height:1.4;word-break:break-word; }
  /* 2.16: Markdown en las notas. */
  .md-p { white-space:pre-wrap;min-height:1.2em; }
  .md-h1 { font-size:17px;font-weight:800;margin:2px 0 4px;letter-spacing:-.01em; }
  .md-h2 { font-size:15px;font-weight:750;margin:2px 0 3px; }
  .md-h3 { font-size:13.5px;font-weight:750;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);margin:2px 0; }
  .md-li { display:flex;gap:7px; }
  .md-li::before { content:'';width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7;margin-top:.55em;flex-shrink:0; }
  .md-ol { display:flex;gap:6px; }
  .md-ol b { font-weight:700;opacity:.7;min-width:14px; }
  .md-cita { border-left:3px solid color-mix(in srgb, var(--c) 70%, #fff);padding:1px 0 1px 9px;color:var(--text2);font-style:italic; }
  .md-hr { height:1px;background:color-mix(in srgb, var(--text) 22%, transparent);margin:7px 0; }
  .nota-texto code { font-family:ui-monospace, Consolas, monospace;font-size:12px;padding:1px 5px;border-radius:6px;background:rgba(0,0,0,.25); }
  .nota-texto a { color:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb, var(--c) 80%, #fff);text-underline-offset:2px;cursor:pointer; }
  .nota-texto mark { background:color-mix(in srgb, #fbbf24 45%, transparent);color:inherit;border-radius:4px;padding:0 2px; }
  /* Barra del editor (modo lápiz) y vista previa (modo ojo). */
  .md-barra { display:flex;gap:3px;flex-wrap:wrap;align-items:center; }
  .md-barra button {
    min-width:30px;height:28px;padding:0 7px;border-radius:9px;border:1px solid rgba(255,255,255,.12);color:var(--text);font:inherit;font-size:12.5px;cursor:pointer;
    background:radial-gradient(120% 90% at 30% 0%, rgba(255,255,255,.18), rgba(255,255,255,0) 60%), var(--bg2);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.25);display:grid;place-items:center;transition:transform .25s cubic-bezier(.34,1.56,.64,1), background .15s;
  }
  .md-barra button:hover { transform:translateY(-1px);background:var(--bg3); }
  .md-barra .sep { width:1px;height:18px;background:var(--border);margin:0 3px; }
  .md-barra .modo-md { margin-left:auto;display:flex;background:var(--bg2);border-radius:999px;padding:2px; }
  .md-barra .modo-md button { border:none;background:transparent;box-shadow:none;border-radius:999px;color:var(--text2);height:24px; }
  .md-barra .modo-md button.activo { background:color-mix(in srgb, var(--accent2) 30%, transparent);color:var(--text); }
  .md-vista { min-height:110px;max-height:260px;overflow:auto;padding:12px 14px;border-radius:14px;background:var(--bg2);--c:var(--accent2); }
  /* Casillas propias: círculo de cristal; al marcarla se llena del acento y el check se dibuja. */
  .casilla { display:flex;gap:8px;align-items:flex-start;cursor:pointer;padding:2px 0;border-radius:8px; }
  .casilla .marca {
    width:17px;height:17px;flex-shrink:0;margin-top:1px;border-radius:50%;display:grid;place-items:center;
    border:1.5px solid color-mix(in srgb, var(--text) 45%, transparent);
    background:rgba(255,255,255,.06);box-shadow:inset 0 1px 1px rgba(255,255,255,.18);
    transition:background .25s, border-color .25s, transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .casilla .marca svg path { stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .3s ease .05s; }
  .casilla:hover .marca { transform:scale(1.1);border-color:var(--text); }
  .casilla.marcada .marca { background:var(--accent);border-color:var(--accent); }
  .casilla.marcada .marca svg path { stroke-dashoffset:0; }
  .casilla .t { transition:opacity .25s; }
  .casilla.marcada .t { text-decoration:line-through;opacity:.55; }

  .nota-meta { display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;align-items:center; }
  .etq { font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.2);color:var(--text);display:inline-flex;align-items:center;gap:5px;white-space:nowrap; }
  .etq.u-baja { background:color-mix(in srgb, #60a5fa 36%, transparent); }
  .etq.u-media { background:color-mix(in srgb, #fbbf24 38%, transparent); }
  .etq.u-alta { background:color-mix(in srgb, #f87171 45%, transparent); }
  .etq.rec-hoy { background:color-mix(in srgb, #fbbf24 30%, transparent); }
  .etq.rec-vencido { background:color-mix(in srgb, #f87171 40%, transparent); }
  .nota-acc { position:absolute;top:-12px;right:8px;display:flex;gap:3px;opacity:0;transform:translateY(4px) scale(.9);transition:opacity .15s, transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none; }
  .nota:hover .nota-acc { opacity:1;transform:none;pointer-events:auto; }
  .nota.cogida .nota-acc { opacity:0; }
  .nota-acc button {
    width:26px;height:26px;border-radius:9px;border:1px solid rgba(255,255,255,.18);color:var(--text);display:grid;place-items:center;cursor:pointer;
    background:
      radial-gradient(120% 90% at 30% 0%, rgba(255,255,255,.28), rgba(255,255,255,0) 60%),
      color-mix(in srgb, var(--bg2) 45%, transparent);
    -webkit-backdrop-filter:url(#vidrio-boton) blur(2px) saturate(1.8);backdrop-filter:url(#vidrio-boton) blur(2px) saturate(1.8);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.45), inset 0 -3px 6px -3px rgba(0,0,0,.35), 0 6px 14px -8px rgba(0,0,0,.6);
    transition:transform .3s cubic-bezier(.34,1.56,.64,1), background .15s;
  }
  .nota-acc button:hover { transform:scale(1.12); }
  .nota-acc button:hover { background:var(--bg3); }
  .nota-acc button.peligro:hover { background:var(--danger, #e5484d);color:#fff; }

  /* Nota nueva escribiéndose en su sitio del mapa. */
  .nota.borrador { cursor:text;animation:notaCae .45s cubic-bezier(.34,1.56,.64,1) both;--c:var(--accent2); }
  .nota.borrador textarea {
    width:100%;min-height:54px;resize:none;border:none !important;background:transparent !important;padding:0 !important;
    color:var(--text);font:inherit;font-size:13.5px;line-height:1.4;outline:none;box-shadow:none !important;
  }
  .nota.borrador .pista { font-size:10.5px;color:var(--text2);margin-top:6px; }
  .nota.fijada { box-shadow:inset 0 1px 1px rgba(255,255,255,.4), 0 0 0 1.5px color-mix(in srgb, var(--accent) 55%, transparent), 0 14px 28px -14px rgba(0,0,0,.65); }
  .etq.vence-hoy { background:color-mix(in srgb, #fbbf24 34%, transparent); }
  .etq.vence-pasado { background:color-mix(in srgb, #f87171 45%, transparent); }
  .etq svg { flex-shrink:0; }

  /* Popups */
  .pop-nota { width:390px;max-height:calc(100vh - 40px);overflow-y:auto; }
  .pop-nota textarea { min-height:110px;resize:vertical; }
  .fila { display:flex;gap:8px;align-items:center;flex-wrap:wrap; }
  .fila > label.et, .fila > span.et { font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);min-width:80px; }
  .seg { display:flex;background:var(--bg2);border-radius:999px;padding:3px;gap:2px; }
  .seg button { border:none;background:transparent;color:var(--text2);font:inherit;font-size:11.5px;font-weight:650;padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px; }
  .seg button i { width:7px;height:7px;border-radius:50%; }
  .seg button.activo { background:color-mix(in srgb, var(--accent2) 26%, transparent);color:var(--text); }
  .colores { display:flex;gap:5px;flex-wrap:wrap; }
  .colores button { width:20px;height:20px;border-radius:50%;border:none;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);transition:transform .25s cubic-bezier(.34,1.56,.64,1); }
  .colores button:hover { transform:scale(1.15); }
  .colores button.sel { outline:2px solid var(--text);outline-offset:1px; }
  .colores button.ninguno { background:transparent;border:1.5px dashed var(--text3); }
  /* La fecha del recordatorio, con la letra de la app y el calendario en el tema de la app. */
  #pnRecordatorio, #pnVence { font:inherit;font-size:13px;font-weight:600;color-scheme:dark;padding:10px 14px;background:var(--bg2) !important;border:1px solid transparent !important;border-radius:14px;color:var(--text); }
  :root[data-scheme="light"] #pnRecordatorio, :root[data-scheme="light"] #pnVence { color-scheme:light; }
  #pnRecordatorio::-webkit-calendar-picker-indicator { opacity:.6;cursor:pointer; }
  /* Selector «avísame dentro de…» (2.16): número con − / + y la unidad. */
  .dentro {
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;border-radius:16px;
    background:radial-gradient(120% 90% at 30% 0%, rgba(255,255,255,.14), rgba(255,255,255,0) 60%), color-mix(in srgb, var(--bg2) 70%, transparent);
    border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 1px rgba(255,255,255,.2);
    -webkit-backdrop-filter:url(#vidrio) blur(4px);backdrop-filter:url(#vidrio) blur(4px);
    animation:notaCae .4s cubic-bezier(.34,1.56,.64,1) both;
  }
  .dentro[hidden] { display:none; }
  .paso { display:flex;align-items:center;gap:2px;background:var(--bg2);border-radius:999px;padding:3px; }
  .paso button { width:28px;height:28px;border-radius:50%;border:none;background:transparent;color:var(--text);font:inherit;font-size:16px;cursor:pointer; }
  .paso button:hover { background:var(--bg3); }
  .paso input { width:44px !important;text-align:center;padding:4px !important;background:transparent !important;border:none !important;font-weight:750;font-size:14px !important; }
  .dentro .que { font-size:11.5px;color:var(--text2);width:100%; }
  .rapidos { display:flex;gap:5px;flex-wrap:wrap; }
  .rapidos button { border:1px solid var(--border);background:transparent;color:var(--text2);font:inherit;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;cursor:pointer; }
  .rapidos button:hover { color:var(--text);background:var(--bg2); }

  /* Caja fuerte */
  .caja { flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;animation:notaCae .45s cubic-bezier(.34,1.56,.64,1) both; }
  .caja[hidden] { display:none; }
  .caja-cerrada { flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:10px; }
  .candado {
    width:84px;height:84px;border-radius:28px;display:grid;place-items:center;color:var(--accent);
    background:radial-gradient(120% 80% at 30% 0%, rgba(255,255,255,.22), rgba(255,255,255,0) 60%), color-mix(in srgb, var(--accent2) 18%, transparent);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.18); box-shadow:inset 0 1px 1px rgba(255,255,255,.35), 0 14px 30px -14px rgba(0,0,0,.6);
  }
  .candado.temblor { animation:temblor .4s; }
  @keyframes temblor { 20%,60% { transform:translateX(-6px); } 40%,80% { transform:translateX(6px); } }
  .caja-cerrada h3 { margin:0;font-size:17px; }
  .caja-cerrada p { margin:0;font-size:12.5px;color:var(--text2);max-width:300px;line-height:1.45; }
  .caja-cerrada input { width:230px !important;padding:11px 14px !important;text-align:center;font-size:16px !important;letter-spacing:.2em; }
  .caja-cerrada input.clave { letter-spacing:.05em; }
  .caja-cerrada input::placeholder { letter-spacing:normal;font-size:13px; }
  .caja-error { color:var(--danger, #e5484d);font-size:12.5px;min-height:16px; }
  .enlace { background:none;border:none;color:var(--text3);font:inherit;font-size:11.5px;cursor:pointer;text-decoration:underline; }
  .caja-abierta { flex:1;min-height:0;display:flex;flex-direction:column;gap:10px; }
  .caja-lista { flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:14px 6px 6px 2px; }
  .nota.segura { position:relative;width:auto;--c:#8b5cf6;cursor:default;user-select:text; }
  .nota.segura .nota-titulo { font-weight:700;font-size:13.5px;margin-bottom:3px; }
  .caja-aviso { font-size:11.5px;color:var(--text3); }
  .vacio { font-size:12.5px;color:var(--text3);text-align:center;padding:16px; }
</style>

<body>
<!-- Cristal líquido con deformación (2.16): filtros SVG que se usan como backdrop-filter. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="vidrio" x="0" y="0" width="1" height="1" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">

<script>
const { ipcRenderer } = require('electron');
let currentState = null;
let filtroSeccion = '';      // '' = todas (los filtros apagan, no esconden)
let busqueda = '';
let verHechas = false;
const ANCHO_NOTA = 230;
const COLORES_NOTA = ['#f87171', '#fb923c', '#fbbf24', '#a3e635', '#34d399', '#2dd4bf', '#38bdf8', '#60a5fa', '#818cf8', '#a78bfa', '#e879f9', '#f472b6'];
const URGENCIAS = { baja: 'Baja', media: 'Media', alta: 'Urgente' };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enviar = (type, payload) => ipcRenderer.send('action', { type, payload });

const mapa = document.getElementById('mapa');
const lienzo = document.getElementById('lienzo');

// ── Vista del mapa (desplazamiento y zoom), recordada en este equipo ──────────
let vista = { x: 40, y: 30, z: 1 };
try { const v = JSON.parse(localStorage.getItem('notas.vista') || 'null'); if (v && Number.isFinite(v.x) && Number.isFinite(v.y) && Number.isFinite(v.z)) vista = v; } catch {}
let primeraVez = !(() => { try { return localStorage.getItem('notas.vista'); } catch { return null; } })();
function aplicarVista() {
  lienzo.style.transform = `translate(${vista.x}px, ${vista.y}px) scale(${vista.z})`;
  mapa.style.backgroundPosition = `${vista.x}px ${vista.y}px`;
  mapa.style.backgroundSize = `${24 * vista.z}px ${24 * vista.z}px`;
  try { localStorage.setItem('notas.vista', JSON.stringify(vista)); } catch {}
}
function zoomEn(d, cx, cy) {
  const r = mapa.getBoundingClientRect();
  const px = cx == null ? r.width / 2 : cx - r.left, py = cy == null ? r.height / 2 : cy - r.top;
  const z = Math.max(0.4, Math.min(1.6, vista.z + d));
  vista.x = px - (px - vista.x) * (z / vista.z);
  vista.y = py - (py - vista.y) * (z / vista.z);
  vista.z = z;
  lienzo.style.transition = cx == null ? 'transform .35s cubic-bezier(.22,1,.36,1)' : '';
  aplicarVista();
}
// Que se vean todas: encuadra la caja que las contiene.
function encuadrar(animado) {
  const ns = notasVisibles();
  if (!ns.length) { vista = { x: 40, y: 30, z: 1 }; aplicarVista(); return; }
  const xs = ns.map(n => n.x), ys = ns.map(n => n.y);
  const minX = Math.min(...xs), minY = Math.min(...ys), maxX = Math.max(...xs) + ANCHO_NOTA, maxY = Math.max(...ys) + 140;
  const r = mapa.getBoundingClientRect();
  // Arriba se deja sitio para los botones de ordenar.
  const arriba = 58;
  const z = Math.max(0.4, Math.min(1, Math.min((r.width - 40) / (maxX - minX), (r.height - arriba - 24) / (maxY - minY))));
  vista = { z, x: (r.width - (maxX - minX) * z) / 2 - minX * z, y: arriba + (r.height - arriba - (maxY - minY) * z) / 2 - minY * z };
  lienzo.style.transition = animado ? 'transform .45s cubic-bezier(.22,1,.36,1)' : '';
  aplicarVista();
}
aplicarVista();

// Arrastrar el fondo para moverse.
let pan = null;
mapa.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || e.target.closest('.nota, .mapa-herr')) return;
  pan = { sx: e.clientX, sy: e.clientY, x: vista.x, y: vista.y };
  lienzo.style.transition = '';
  mapa.setPointerCapture(e.pointerId); mapa.classList.add('moviendo');
});
mapa.addEventListener('pointermove', (e) => { if (!pan) return; vista.x = pan.x + e.clientX - pan.sx; vista.y = pan.y + e.clientY - pan.sy; aplicarVista(); });
mapa.addEventListener('pointerup', () => { pan = null; mapa.classList.remove('moviendo'); });
mapa.addEventListener('wheel', (e) => {
  e.preventDefault();
  lienzo.style.transition = '';
  if (e.ctrlKey) { zoomEn(-e.deltaY * 0.0015, e.clientX, e.clientY); return; }
  vista.x -= e.shiftKey ? e.deltaY : e.deltaX; vista.y -= e.shiftKey ? 0 : e.deltaY; aplicarVista();
}, { passive: false });
// Doble clic en el fondo: nota nueva escribiéndose ahí mismo.
mapa.addEventListener('dblclick', (e) => {
  if (e.target.closest('.nota, .mapa-herr')) return;
  const p = aMapa(e.clientX, e.clientY);
  nuevaNotaEn(p.x - 24, p.y - 18);
});
// Clic derecho: el menú redondo (en el fondo, el del mapa; en una nota, el de la nota).
mapa.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const el = e.target.closest('.nota');
  if (el && el.classList.contains('borrador')) return;
  if (el) { const n = (currentState.notas || []).find(x => x.id === el.dataset.id); if (n) menuNota(e, n); return; }
  menuMapa(e);
});

// Borrador: una tarjeta con el cursor dentro, en su sitio. Enter guarda, Mayús+Enter salta de
// línea, Esc (o quedarse vacía) la descarta.
let borrador = null;
function nuevaNotaEn(x, y, inicial, extra) {
  cerrarBorrador(true);
  const el = document.createElement('div');
  el.className = 'nota borrador';
  el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.zIndex = '9998';
  el.innerHTML = '<textarea maxlength="4000" placeholder="Escribe la nota…"></textarea><div class="pista">Enter guarda · Mayús+Enter, otra línea · Esc, nada</div>';
  lienzo.appendChild(el);
  const ta = el.querySelector('textarea');
  ta.value = inicial || '';
  const crecer = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
  ta.addEventListener('input', crecer);
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); cerrarBorrador(true); }
    else if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      // En una lista de casillas, Enter abre otra casilla; Enter en una vacía, guarda.
      const lineas = ta.value.split('\n'), ult = lineas[lineas.length - 1];
      if (/^\[ \]\s*\S/.test(ult)) { ta.value += '\n[ ] '; crecer(); return; }
      if (/^\[ \]\s*$/.test(ult) && lineas.length > 1) { lineas.pop(); ta.value = lineas.join('\n'); }
      cerrarBorrador(false);
    }
  });
  ta.addEventListener('blur', () => setTimeout(() => { if (borrador && borrador.el === el) cerrarBorrador(false); }, 120));
  el.addEventListener('pointerdown', (e) => e.stopPropagation());

// ── Markdown ──────────────────────────────────────────────────────────────────
// Lo justo para que las notas queden bonitas: títulos, negrita, cursiva, tachado, resaltado,
// código, enlaces, listas, citas, separadores y casillas (las propias, que se marcan desde la nota).
const BT = String.fromCharCode(96);   // la comilla invertida del código
// Una línea sin las marcas de Markdown (para títulos cortos, como el del menú redondo).
function textoPlano(t) {
  return String(t || '').replace(/^\s*(?:-\s*)?\[( |x|X)\]\s*|^#{1,3}\s+|^\s*[-*•>]\s+/, '').replace(/\*\*|__|~~|==|[*_]/g, '').split(BT).join('');
}
function mdLinea(t) {
  let h = esc(t);
  h = h.replace(new RegExp(BT + '([^' + BT + ']+)' + BT, 'g'), '<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(new RegExp('__([^_]+)__', 'g'), '<b>$1</b>');
  h = h.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>').replace(/(^|\W)_([^_\s][^_]*)_(?=\W|$)/g, '$1<i>$2</i>');
  h = h.replace(/~~([^~]+)~~/g, '<s>$1</s>').replace(/==([^=]+)==/g, '<mark>$1</mark>');
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a data-url="$2">$1</a>');
  return h;
}
function pintarMarkdown(cont, texto, idNota) {
  cont.innerHTML = '';
  const lineas = String(texto || '').split('\n');
  lineas.forEach((linea, i) => {
    const casilla = linea.match(/^\s*(?:-\s*)?\[( |x|X)\]\s?(.*)$/);
    let el;
    if (casilla) {
      const hecho = casilla[1] !== ' ';
      el = document.createElement('div');
      el.className = 'casilla' + (hecho ? ' marcada' : '');
      el.setAttribute('role', 'checkbox'); el.setAttribute('aria-checked', String(hecho)); el.tabIndex = 0;
      el.innerHTML = `<span class="marca">${ICO.check}</span><span class="t">${mdLinea(casilla[2])}</span>`;
      if (idNota) {
        const alternar = (e) => {
          e.stopPropagation();
          el.classList.toggle('marcada');
          const ls = lineas.slice();
          ls[i] = linea.replace(/\[( |x|X)\]/, el.classList.contains('marcada') ? '[x]' : '[ ]');
          setTimeout(() => enviar('nota-editar', { id: idNota, texto: ls.join('\n') }), 320);   // que se vea el check dibujarse
        };
        el.addEventListener('pointerdown', (e) => e.stopPropagation());
        el.onclick = alternar;
        el.onkeydown = (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); alternar(e); } };
      }
    } else {
      let m;
      el = document.createElement('div');
      if ((m = linea.match(/^(#{1,3})\s+(.*)$/))) { el.className = 'md-h' + m[1].length; el.innerHTML = mdLinea(m[2]); }
      else if ((m = linea.match(/^\s*[-*•]\s+(.*)$/))) { el.className = 'md-li'; el.innerHTML = `<span>${mdLinea(m[1])}</span>`; }
      else if ((m = linea.match(/^\s*(\d+)[.)]\s+(.*)$/))) { el.className = 'md-ol'; el.innerHTML = `<b>${m[1]}.</b><span>${mdLinea(m[2])}</span>`; }
      else if ((m = linea.match(/^>\s?(.*)$/))) { el.className = 'md-cita'; el.innerHTML = mdLinea(m[1]); }
      else if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(linea)) { el.className = 'md-hr'; }
      else { el.className = 'md-p'; el.innerHTML = mdLinea(linea); }
    }
    cont.appendChild(el);
  });
  // Enlaces: se abren en el navegador (solo http/https).
  cont.querySelectorAll('a[data-url]').forEach(a => {
    a.addEventListener('pointerdown', (e) => e.stopPropagation());
    a.onclick = (e) => { e.stopPropagation(); try { require('electron').shell.openExternal(a.dataset.url); } catch {} };
  });
}

// Barra del editor: envuelve lo seleccionado o pone el prefijo a las líneas elegidas.
function mdEnvolver(pre, post, ejemplo) {
  const ta = document.getElementById('pnTexto');
  const a = ta.selectionStart, b = ta.selectionEnd, sel = ta.value.slice(a, b) || ejemplo;
  ta.setRangeText(pre + sel + post, a, b, 'end');
  if (a === b) { ta.selectionStart = a + pre.length; ta.selectionEnd = a + pre.length + sel.length; }
  ta.focus();
}
function mdPrefijo(prefijo) {
  const ta = document.getElementById('pnTexto');
  const ini = ta.value.lastIndexOf('\n', ta.selectionStart - 1) + 1;
  let fin = ta.value.indexOf('\n', ta.selectionEnd); if (fin < 0) fin = ta.value.length;
  let k = 0;
  const nuevo = ta.value.slice(ini, fin).split('\n').map(l => (typeof prefijo === 'function' ? prefijo(++k) : prefijo) + l.replace(/^(#{1,3}\s+|[-*•]\s+|\d+[.)]\s+|>\s?|\[( |x|X)\]\s?)/, '')).join('\n');
  ta.setRangeText(nuevo, ini, fin, 'end');
  ta.focus();
}
const MD_ACCIONES = {
  b: () => mdEnvolver('**', '**', 'negrita'), i: () => mdEnvolver('*', '*', 'cursiva'), s: () => mdEnvolver('~~', '~~', 'tachado'),
  mark: () => mdEnvolver('==', '==', 'resaltado'), code: () => mdEnvolver(BT, BT, 'código'),
  link: () => mdEnvolver('[', '](https://)', 'texto del enlace'),
  h1: () => mdPrefijo('# '), h2: () => mdPrefijo('## '), ul: () => mdPrefijo('- '), ol: () => mdPrefijo(k => k + '. '),
  check: () => mdPrefijo('[ ] '), quote: () => mdPrefijo('> '),
  hr: () => { const ta = document.getElementById('pnTexto'); ta.setRangeText('\n---\n', ta.selectionStart, ta.selectionEnd, 'end'); ta.focus(); },
};
document.querySelectorAll('#mdBarra [data-md]').forEach(b => b.onclick = () => { if (!document.getElementById('pnTexto').hidden) MD_ACCIONES[b.dataset.md](); });
document.getElementById('pnTexto').addEventListener('keydown', (e) => {

// Atajos del recordatorio: dentro de 1 h, 2 h, 1 día, 2 días, 1 semana; «Otro…» abre el selector.
const RAPIDOS = { '1h': [1, 'h'], '2h': [2, 'h'], '1d': [1, 'd'], '2d': [2, 'd'], '1s': [1, 's'] };
const UNIDADES = [['min', 'Minutos'], ['h', 'Horas'], ['d', 'Días'], ['s', 'Semanas'], ['mes', 'Meses']];
function dentroDe(n, u) {
  const d = new Date();
  if (u === 'min') d.setMinutes(d.getMinutes() + n);
  else if (u === 'h') d.setHours(d.getHours() + n);
  else if (u === 'd') d.setDate(d.getDate() + n);
  else if (u === 's') d.setDate(d.getDate() + 7 * n);
  else if (u === 'mes') d.setMonth(d.getMonth() + n);
  d.setSeconds(0, 0);
  return d.getTime();
}
// Selector propio: − número + y la unidad; enseña cuándo avisará y llama a poner(ms).
function selectorDentro(cont, poner, textoBoton) {
  let n = 30, u = 'min';
  cont.innerHTML = `<div class="paso"><button type="button" data-p="-">−</button><input type="number" min="1" max="999" value="30"><button type="button" data-p="+">+</button></div>
    <div class="seg">${UNIDADES.map(([k, t]) => `<button type="button" data-u="${k}">${t}</button>`).join('')}</div>
    <div class="que"></div>
    <button type="button" class="btn-primary" style="margin-left:auto">${textoBoton || 'Poner'}</button>`;
  const inp = cont.querySelector('input'), que = cont.querySelector('.que');
  const pintar = () => {
    cont.querySelectorAll('[data-u]').forEach(b => b.classList.toggle('activo', b.dataset.u === u));
    inp.value = n;
    que.textContent = 'Avisará ' + textoRecordatorio(dentroDe(n, u)).toLowerCase();
  };
  cont.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { n = Math.max(1, Math.min(999, n + (b.dataset.p === '+' ? 1 : -1))); pintar(); });
  inp.oninput = () => { n = Math.max(1, Math.min(999, parseInt(inp.value, 10) || 1)); que.textContent = 'Avisará ' + textoRecordatorio(dentroDe(n, u)).toLowerCase(); };
  inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); poner(dentroDe(n, u)); } };
  cont.querySelectorAll('[data-u]').forEach(b => b.onclick = () => { u = b.dataset.u; pintar(); });
  cont.querySelector('.btn-primary').onclick = () => poner(dentroDe(n, u));
  pintar();
  setTimeout(() => { inp.focus(); inp.select(); }, 0);
}
document.querySelectorAll('#pnRapidos button').forEach(b => b.onclick = () => {
  const i = document.getElementById('pnRecordatorio');
  const dentro = document.getElementById('pnDentro');
  if (b.dataset.r === 'quitar') { i.value = ''; dentro.hidden = true; return; }
  if (b.dataset.r === 'otro') {
    dentro.hidden = !dentro.hidden;
    if (!dentro.hidden) selectorDentro(dentro, (ms) => { i.value = aLocal(ms); dentro.hidden = true; });
    return;
  }
  const [n, u] = RAPIDOS[b.dataset.r];
  i.value = aLocal(dentroDe(n, u));
  dentro.hidden = true;
});
// Desde el menú redondo, «Otro…» sale en su propia ventanita de cristal.
function abrirDentro(idNota) {
  const fondo = document.getElementById('popDentroFondo'), pop = document.getElementById('popDentro');
  fondo.style.display = 'block'; pop.style.display = 'flex';
  selectorDentro(document.getElementById('popDentroCuerpo'), (ms) => { enviar('nota-editar', { id: idNota, recordatorio: ms }); cerrarDentro(); }, 'Avisarme');
}
function cerrarDentro() { document.getElementById('popDentroFondo').style.display = 'none'; document.getElementById('popDentro').style.display = 'none'; }
function cerrarPopNota() { popId = null; document.getElementById('popNotaFondo').style.display = 'none'; document.getElementById('popNota').style.display = 'none'; }
function guardarPopNota() {
  const texto = document.getElementById('pnTexto').value.trim();
  if (!texto) { borrarDesdePop(); return; }
  const r = document.getElementById('pnRecordatorio').value;
  const v = document.getElementById('pnVence').value;
  enviar('nota-editar', { id: popId, texto, urgencia: popUrgencia, seccion: document.getElementById('pnSeccion').value || null, color: popColor, recordatorio: r ? new Date(r).getTime() : null, vence: v ? new Date(v + 'T00:00').getTime() : null });
  cerrarPopNota();
}
function borrarDesdePop() {
  const id = popId; cerrarPopNota();
  const el = lienzo.querySelector(`.nota[data-id="${id}"]`);
  if (el) irse(el, () => enviar('nota-borrar', { id }), true); else enviar('nota-borrar', { id });
}

// ── Secciones ─────────────────────────────────────────────────────────────────
let secId = null, secColor = COLORES_NOTA[6];
function abrirPopSec(id) {
  const s = id ? seccionDe(id) : null;
  secId = s ? id : null; secColor = null;
  document.getElementById('popSecTitulo').textContent = s ? 'Sección' : 'Nueva sección';
  document.getElementById('psNombre').value = s ? s.name : '';
  document.getElementById('psBorrar').style.display = 'none';   // se borran desde Tareas
  document.getElementById('psColores').innerHTML = '<div style="font-size:12px;color:var(--text2);line-height:1.4">Es una sección de Tareas: su color sale de su paleta (en Tareas, el botón de colores de la sección).</div>';
  document.getElementById('popSecFondo').style.display = 'block';
  document.getElementById('popSec').style.display = 'flex';
  setTimeout(() => document.getElementById('psNombre').focus(), 0);
}
function pintarColoresSec() {
  const c = document.getElementById('psColores'); c.innerHTML = '';
  COLORES_NOTA.forEach(col => { const b = document.createElement('button'); b.style.background = col; if (secColor === col) b.className = 'sel'; b.onclick = () => { secColor = col; pintarColoresSec(); }; c.appendChild(b); });
}
function cerrarPopSec() { document.getElementById('popSecFondo').style.display = 'none'; document.getElementById('popSec').style.display = 'none'; }
function guardarSeccion() {
  const name = document.getElementById('psNombre').value.trim();
  if (!name) return;
  if (secId) enviar('rename-group', { groupId: secId, name });
  else enviar('create-group', { name });
  cerrarPopSec();
}
document.getElementById('psNombre').addEventListener('keydown', (e) => { if (e.key === 'Enter') guardarSeccion(); });
function borrarSeccion() {
  const s = seccionDe(secId); if (!s) return;
  confirmar('Borrar sección', `La sección «${s.name}» se borra; sus notas se quedan, sin sección. Ctrl+Z lo deshace.`, 'Borrar', () => {
    enviar('nota-seccion-borrar', { id: secId }); if (filtroSeccion === secId) filtroSeccion = ''; cerrarPopSec();
  });
}

// ── Confirmar ─────────────────────────────────────────────────────────────────
function confirmar(titulo, texto, ok, fn) {
  document.getElementById('confTitulo').textContent = titulo;
  document.getElementById('confTexto').textContent = texto;
  const b = document.getElementById('confOk'); b.textContent = ok;
  b.onclick = () => { cerrarConf(); fn(); };
  document.getElementById('popConfFondo').style.display = 'block';
  document.getElementById('popConf').style.display = 'flex';
}
function cerrarConf() { document.getElementById('popConfFondo').style.display = 'none'; document.getElementById('popConf').style.display = 'none'; }

// Ctrl+Z / Ctrl+Y fuera de los campos de texto: deshacer y rehacer, como en el calendario.
document.addEventListener('keydown', (e) => {
  const enCampo = e.target.closest && e.target.closest('input, textarea, select');
  if (e.key === 'Escape') { cerrarPopNota(); cerrarPopSec(); cerrarConf(); cerrarDentro(); return; }
  if (enCampo || !(e.ctrlKey || e.metaKey)) return;
  if (e.key.toLowerCase() === 'z') { e.preventDefault(); enviar(e.shiftKey ? 'redo' : 'undo'); }
  if (e.key.toLowerCase() === 'y') { e.preventDefault(); enviar('redo'); }
});

// ── Caja fuerte ───────────────────────────────────────────────────────────────
// Lo de dentro solo pasa por aquí mientras está abierta: al cerrarse (a mano, a los 5 minutos,
// al bloquear Windows) se borra de la página.
let enCaja = false, cajaNotas = null, cajaTipoNuevo = 'pin';
const caja = (accion, extra) => ipcRenderer.invoke('caja', { accion, ...(extra || {}) });
function pintarBotonCaja() {
  const b = document.getElementById('btnCaja');
  b.classList.toggle('activo', enCaja);
  b.querySelector('span').textContent = enCaja ? 'Volver al mapa' : 'Caja fuerte';
}
async function alternarCaja() {
  enCaja = !enCaja;
  document.getElementById('vistaMapa').style.display = enCaja ? 'none' : 'flex';
  document.getElementById('vistaCaja').hidden = !enCaja;
  document.getElementById('titulo').textContent = enCaja ? 'Caja fuerte' : 'Notas';
  pintarBotonCaja();
  if (enCaja) pintarCaja(await caja('estado'));
}
ipcRenderer.on('caja-cerrada', () => { cajaNotas = null; if (enCaja) caja('estado').then(pintarCaja); });

const CANDADO = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><circle cx="12" cy="16" r="1.3" fill="currentColor"/></svg>';
function pintarCaja(est) {
  const v = document.getElementById('vistaCaja');
  if (!est || !est.existe) {
    v.innerHTML = `<div class="caja-cerrada">
      <div class="candado">${CANDADO}</div>
      <h3>Crea tu caja fuerte</h3>
      <p>Notas que nadie ve sin tu PIN o tu contraseña. Se guardan cifradas: si lo olvidas, no hay forma de recuperarlas.</p>
      <div class="seg" id="cjTipo"><button type="button" data-t="pin">PIN</button><button type="button" data-t="clave">Contraseña</button></div>
      <input type="password" id="cj1" autocomplete="new-password">
      <input type="password" id="cj2" autocomplete="new-password">
      <div class="caja-error" id="cjError"></div>
      <button class="btn-primary" id="cjCrear">Crear caja fuerte</button>
    </div>`;
    const ponerTipo = (t) => {
      cajaTipoNuevo = t;
      v.querySelectorAll('#cjTipo button').forEach(b => b.classList.toggle('activo', b.dataset.t === t));
      ['cj1', 'cj2'].forEach((id, i) => { const el = document.getElementById(id); el.inputMode = t === 'pin' ? 'numeric' : 'text'; el.maxLength = t === 'pin' ? 8 : 128; el.classList.toggle('clave', t === 'clave'); el.placeholder = (t === 'pin' ? 'PIN de 4 a 8 números' : 'Contraseña (mín. 6)') + (i ? ' · otra vez' : ''); });
    };
    v.querySelectorAll('#cjTipo button').forEach(b => b.onclick = () => ponerTipo(b.dataset.t));
    ponerTipo(cajaTipoNuevo);
    const crear = async () => {
      const a = document.getElementById('cj1').value, b = document.getElementById('cj2').value;
      const err = document.getElementById('cjError');
      if (a !== b) { err.textContent = 'No coinciden'; return; }
      const r = await caja('crear', { secreto: a, tipo: cajaTipoNuevo });
      if (r.error) { err.textContent = r.error; return; }
      cajaNotas = r.notas; pintarCaja(r);
    };
    document.getElementById('cjCrear').onclick = crear;
    document.getElementById('cj2').addEventListener('keydown', (e) => { if (e.key === 'Enter') crear(); });
    setTimeout(() => document.getElementById('cj1').focus(), 0);
    return;
  }
  if (!est.abierta || !cajaNotas) {
    cajaNotas = null;
    v.innerHTML = `<div class="caja-cerrada">
      <div class="candado" id="cjCandado">${CANDADO}</div>
      <h3>Caja fuerte cerrada</h3>
      <input type="password" id="cjSecreto" placeholder="${est.tipo === 'clave' ? 'Contraseña' : 'PIN'}" ${est.tipo === 'pin' ? 'inputmode="numeric" maxlength="8"' : 'class="clave" maxlength="128"'} autocomplete="off">
      <div class="caja-error" id="cjError"></div>
      <button class="btn-primary" id="cjAbrir">Abrir</button>
      <button class="enlace" id="cjOlvido">¿Lo has olvidado?</button>
    </div>`;
    const abrir = async () => {
      const i = document.getElementById('cjSecreto');
      const r = await caja('abrir', { secreto: i.value });
      if (r.error) {
        document.getElementById('cjError').textContent = r.error;
        const c = document.getElementById('cjCandado'); c.classList.remove('temblor'); void c.offsetWidth; c.classList.add('temblor');
        i.value = ''; i.focus(); return;
      }
      cajaNotas = r.notas; pintarCaja(r);
    };
    document.getElementById('cjAbrir').onclick = abrir;
    document.getElementById('cjSecreto').addEventListener('keydown', (e) => { if (e.key === 'Enter') abrir(); });
    document.getElementById('cjOlvido').onclick = () => confirmar('Borrar la caja fuerte',
      'Sin el PIN o la contraseña no se puede abrir: nadie puede recuperarlo. Si la borras pierdes todas sus notas y puedes crear otra.', 'Borrar todo',
      async () => { pintarCaja(await caja('borrar')); });
    setTimeout(() => document.getElementById('cjSecreto').focus(), 0);
    return;
  }
  // Abierta
  v.innerHTML = `<div class="caja-abierta">
    <div class="apuntar">
      <input type="text" id="cjTitulo" maxlength="120" placeholder="Título (p. ej. Wifi de la oficina)">
      <button class="btn-ghost" id="cjCerrar" title="Cerrarla ya" style="white-space:nowrap">Cerrar caja</button>
    </div>
    <textarea id="cjTexto" maxlength="8000" rows="3" placeholder="Lo que quieras guardar seguro…"></textarea>
    <div style="display:flex;gap:8px;align-items:center"><div style="flex:1" class="caja-aviso" id="cjAviso">Se cierra sola a los 5 minutos sin usarla.</div><button class="btn-primary" id="cjGuardar">Guardar</button></div>
    <div class="caja-lista" id="cjLista"></div>
  </div>`;
  let editando = null;
  const lista = document.getElementById('cjLista');
  const pintarLista = () => {
    lista.innerHTML = '';
    if (!cajaNotas.length) { lista.innerHTML = '<div class="vacio">Todavía no hay nada guardado.</div>'; return; }
    cajaNotas.slice().sort((a, b) => (b.editada || 0) - (a.editada || 0)).forEach(n => {
      const el = document.createElement('div'); el.className = 'nota segura';
      el.innerHTML = `<div class="nota-titulo">${esc(n.titulo || 'Sin título')}</div><div class="nota-texto">${esc(n.texto)}</div>
        <div class="nota-acc"><button title="Copiar" data-a="copiar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button><button title="Editar" data-a="editar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button><button class="peligro" title="Borrar" data-a="borrar">${ICO.borrar}</button></div>`;
      el.querySelector('.nota-acc').onclick = (e) => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.a === 'copiar') { try { require('electron').clipboard.writeText(n.texto); document.getElementById('cjAviso').textContent = 'Copiado'; } catch {} }
        if (b.dataset.a === 'editar') { editando = n.id; document.getElementById('cjTitulo').value = n.titulo; document.getElementById('cjTexto').value = n.texto; document.getElementById('cjGuardar').textContent = 'Guardar cambios'; document.getElementById('cjTexto').focus(); }
        if (b.dataset.a === 'borrar') confirmar('Borrar nota segura', `«${n.titulo || 'Sin título'}» se borra para siempre.`, 'Borrar', () => guardar(cajaNotas.filter(x => x.id !== n.id)));
      };
      lista.appendChild(el);
    });
  };
  const guardar = async (nueva) => {
    const r = await caja('guardar', { notas: nueva });
    if (r.error) { document.getElementById('cjAviso').textContent = r.error; caja('estado').then(pintarCaja); return; }
    cajaNotas = r.notas; pintarLista();
  };
  document.getElementById('cjGuardar').onclick = () => {
    const titulo = document.getElementById('cjTitulo').value.trim(), texto = document.getElementById('cjTexto').value;
    if (!titulo && !texto.trim()) return;
    const nueva = editando ? cajaNotas.map(x => x.id === editando ? { ...x, titulo, texto } : x) : [{ titulo, texto, creada: Date.now() }, ...cajaNotas];
    editando = null;
    document.getElementById('cjTitulo').value = ''; document.getElementById('cjTexto').value = '';
    document.getElementById('cjGuardar').textContent = 'Guardar';
    guardar(nueva);
  };
  document.getElementById('cjCerrar').onclick = async () => { cajaNotas = null; pintarCaja(await caja('cerrar')); };
  // Mientras se usa, no se cierra sola.
  let ultimoToque = 0;
  v.oninput = v.onclick = () => { if (Date.now() - ultimoToque > 20000) { ultimoToque = Date.now(); caja('tocar'); } };
  pintarLista();
  setTimeout(() => document.getElementById('cjTitulo').focus(), 0);
}
</script>
</body>
</html>
